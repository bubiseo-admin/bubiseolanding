<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 2026-11-02 [사용자 명시] 분양파트너십 기능 종료 — 예전에 공유된 분양 현장 링크가 들어오면 종료 안내만 보여 준다. -->
  <title>부비서</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    html, body { margin: 0; padding: 0; font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; color: #191F28; background: #F9FAFB; }
    main { max-width: 480px; margin: 0 auto; padding: 96px 24px; text-align: center; }
    img { width: 48px; height: 48px; }
    h1 { margin: 20px 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 28px; font-size: 15px; color: #4E5968; line-height: 1.6; }
    a { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; background: #191F28; color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.png" alt="부비서" />
    <h1>더 이상 제공되지 않는 안내예요</h1>
    <p>이 분양 현장 안내 링크는 서비스가 종료되었습니다.</p>
    <a href="/">부비서로 가기</a>
  </main>
</body>
</html>
