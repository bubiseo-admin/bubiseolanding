<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>분양 현장 안내 — 부비서</title>
  <meta name="description" content="공인중개사가 추천한 분양 현장" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <style>
    :root {
      --pri: #6155F5;
      --pri2: #39AFFD;
      --bg: #F9FAFB;
      --card: #FFFFFF;
      --line: #E5E8EB;
      --text: #191F28;
      --sub: #4E5968;
      --tertiary: #8B95A1;
      --error: #E0533D;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); background: var(--bg); }
    .brand-bar { padding: 18px 20px; display: flex; align-items: center; gap: 10px; background: #fff; border-bottom: 1px solid var(--line); }
    .brand-bar img { width: 26px; height: 26px; }
    .brand-bar span { font-weight: 800; font-size: 15px; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 18px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

    /* 2026-05-25 [사용자 명시] 작업 4 — 최상단 제목: 부동산 상호명 + 담당자 이름 + 직급 뱃지. */
    .sharer-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .sharer-card .est-icon {
      width: 42px; height: 42px; border-radius: 999px;
      background: linear-gradient(135deg, var(--pri) 0%, var(--pri2) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; font-weight: 800; flex-shrink: 0;
    }
    .sharer-card .text { flex: 1; min-width: 0; }
    .sharer-card .estate { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .sharer-card .person { font-size: 13px; color: var(--sub); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sharer-card .position-badge {
      padding: 2px 8px; border-radius: 999px;
      background: rgba(97,85,245,0.12); color: var(--pri);
      font-size: 11px; font-weight: 700; line-height: 1.4;
    }

    .title { font-size: 22px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.5px; line-height: 1.3; }
    .address { font-size: 13px; color: var(--sub); margin: 0 0 12px; }
    .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 0; }
    .meta-chip { padding: 4px 10px; border-radius: 999px; background: #F2F4F6; font-size: 12px; font-weight: 600; color: var(--sub); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 12px; }
    .badge { padding: 5px 11px; background: linear-gradient(135deg, var(--pri) 0%, var(--pri2) 100%); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; }

    /* 2026-05-25 [사용자 명시] 작업 3 — 사진 클릭 → lightbox. 썸네일에 cursor:zoom-in. */
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-bottom: 16px; }
    .gallery img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; background: #F2F4F6; cursor: zoom-in; transition: transform 0.15s; }
    .gallery img:active { transform: scale(0.97); }
    .gallery video { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: #000; }

    .info-row { display: flex; align-items: flex-start; padding: 6px 0; }
    .info-label { width: 92px; flex-shrink: 0; font-size: 13px; font-weight: 600; color: var(--tertiary); }
    .info-value { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-list .chip { padding: 4px 10px; border-radius: 999px; background: rgba(97,85,245,0.10); border: 1px solid rgba(97,85,245,0.25); font-size: 12px; font-weight: 700; color: var(--pri); }
    .file-btn { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(97,85,245,0.06); border: 1px solid rgba(97,85,245,0.2); border-radius: 10px; color: var(--pri); font-size: 14px; font-weight: 700; text-decoration: none; margin-bottom: 8px; }
    .file-btn::after { content: '›'; margin-left: auto; font-size: 18px; }
    .section-label { font-size: 13px; font-weight: 700; color: var(--sub); margin: 18px 0 8px; padding-left: 4px; }
    .expire-note { color: var(--tertiary); font-size: 12px; text-align: center; padding: 18px 0 32px; }
    .err { text-align: center; padding: 60px 20px; }
    .err h2 { font-size: 18px; margin: 12px 0 6px; }
    .err p { color: var(--sub); font-size: 14px; margin: 0; line-height: 1.6; }
    .err .icon { font-size: 48px; }
    .loading { text-align: center; padding: 80px 20px; color: var(--sub); }

    /* 2026-05-25 [사용자 명시] 작업 6 — 하단 담당자 연락처 (부동산 + 분양대행사). */
    .contact-section { margin-top: 8px; }
    .contact-card { padding: 16px; background: #fff; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 10px; }
    .contact-label {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: rgba(97,85,245,0.10); color: var(--pri);
      font-size: 11px; font-weight: 800; letter-spacing: -0.2px; margin-bottom: 8px;
    }
    .contact-label--ad { background: rgba(255,153,0,0.15); color: #C46100; }
    .contact-name { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .contact-sub { font-size: 12px; color: var(--tertiary); margin-top: 3px; }
    .contact-actions { display: flex; gap: 8px; margin-top: 12px; }
    .contact-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 44px; border-radius: 10px; text-decoration: none;
      font-size: 14px; font-weight: 700; cursor: pointer; border: none;
      transition: opacity 0.15s;
    }
    .contact-btn:active { opacity: 0.8; }
    .contact-btn--call { background: linear-gradient(135deg, var(--pri) 0%, var(--pri2) 100%); color: #fff; }
    .contact-btn--sms { background: #fff; color: var(--pri); border: 1px solid rgba(97,85,245,0.35); }
    .contact-btn--call.disabled, .contact-btn--sms.disabled { opacity: 0.4; pointer-events: none; }

    /* 2026-05-25 [사용자 명시] 작업 3 — Lightbox 오버레이.
       검정 배경 + 사진 한 장 표시 + 좌우 스와이프(가로 스크롤) + 카운터 + 닫기. */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.94);
      display: none; flex-direction: column; z-index: 9999;
    }
    .lightbox.open { display: flex; }
    .lightbox-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; color: #fff;
    }
    .lightbox-counter { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .lightbox-close {
      width: 36px; height: 36px; border-radius: 18px;
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      font-size: 22px; line-height: 1; cursor: pointer;
    }
    .lightbox-scroller {
      flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .lightbox-scroller::-webkit-scrollbar { display: none; }
    .lightbox-slide {
      flex: 0 0 100%; min-width: 100%; height: 100%;
      scroll-snap-align: start;
      display: flex; align-items: center; justify-content: center;
      padding: 8px 16px 16px;
    }
    .lightbox-slide img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      user-select: none; -webkit-user-drag: none;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 22px;
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-prev { left: 12px; }
    .lightbox-next { right: 12px; }
    @media (max-width: 600px) {
      .lightbox-nav { display: none; } /* 모바일은 가로 스와이프 사용 */
    }
  </style>
</head>
<body>
  <div class="brand-bar">
    <img src="/assets/logo.png" alt="" />
    <span>부비서 분양 현장 안내</span>
  </div>
  <main id="root">
    <div class="loading">정보를 불러오는 중…</div>
  </main>

  <!-- 2026-05-25 [사용자 명시] Lightbox 컨테이너 — JS 가 사진 클릭 시 채워서 .open 토글. -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="사진 크게 보기" aria-hidden="true">
    <div class="lightbox-head">
      <span class="lightbox-counter" id="lightboxCounter">1 / 1</span>
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="닫기">×</button>
    </div>
    <div style="position:relative; flex:1; overflow:hidden;">
      <div class="lightbox-scroller" id="lightboxScroller"></div>
      <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="이전">‹</button>
      <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="다음">›</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const API_BASE = 'https://api.bubiseo.com';
    const CATEGORIES = {
      APARTMENT: '아파트',
      OFFICETEL: '오피스텔',
      KNOWLEDGE_INDUSTRY_CENTER: '지식산업센터',
      COMMERCIAL: '상가',
      VILLA: '빌라',
      DETACHED_HOUSE: '단독주택',
      TOWNHOUSE: '타운하우스',
    };

    const root = document.getElementById('root');
    const params = new URLSearchParams(window.location.search);
    const token = params.get('t') || '';
    if (!token) {
      renderError('잘못된 공유 링크입니다.');
      return;
    }

    fetch(`${API_BASE}/presale-partnerships/share/${encodeURIComponent(token)}`)
      .then(async (r) => {
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          throw new Error(j?.message || '공유 링크가 만료됐거나 잘못된 링크입니다.');
        }
        return r.json();
      })
      .then(render)
      .catch((e) => renderError(e.message || '공유 링크가 만료됐거나 잘못된 링크입니다.'));

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function escAttr(s) { return esc(s); }
    function formatPrice(won) {
      const n = Number(won);
      if (!Number.isFinite(n) || n <= 0) return '';
      const eok = Math.floor(n / 100000000);
      const remainMan = Math.floor((n % 100000000) / 10000);
      if (eok > 0 && remainMan === 0) return `${eok}억`;
      if (eok > 0) return `${eok}억 ${remainMan.toLocaleString('ko-KR')}만원`;
      return `${(n / 10000).toLocaleString('ko-KR')}만원`;
    }
    function formatPriceRange(min, max) {
      const a = formatPrice(min), b = formatPrice(max);
      if (a && b) return min === max ? a : `${a} ~ ${b}`;
      if (a) return `${a} ~`;
      if (b) return `~ ${b}`;
      return '';
    }
    function formatFloor(min, max) {
      if (min != null && max != null) return `${min}F ~ ${max}F`;
      if (min != null) return `${min}F ~`;
      if (max != null) return `~ ${max}F`;
      return '';
    }
    function digitsOnly(s) { return String(s ?? '').replace(/[^\d+]/g, ''); }

    function render(d) {
      // ❌ MGM / 광고금액 (mgmFee / adAmount) 절대 노출 금지.
      // ✅ 2026-05-25 [사용자 명시] sharer (부동산 + 담당자 + 직급) 상단, advertiser (분양대행사) 하단 노출.
      const imgs = Array.isArray(d.imageUrls) ? d.imageUrls : [];
      const vids = Array.isArray(d.videoUrls) ? d.videoUrls : [];
      const innerPages = Array.isArray(d.innerPageUrls) ? d.innerPageUrls : [];
      const customerFiles = Array.isArray(d.customerShareFileUrls) ? d.customerShareFileUrls : [];
      const badges = Array.isArray(d.badges) ? d.badges : [];
      const options = Array.isArray(d.options) ? d.options : [];
      const sharer = d.sharer || null;

      const html = [];

      // 2026-05-25 [사용자 명시] 작업 4 — 최상단 sharer 카드 (부동산 상호명 + 담당자 + 직급 뱃지).
      if (sharer && (sharer.estateName || sharer.name)) {
        const estName = sharer.estateName || '부동산';
        const initial = (estName.trim() || '부')[0];
        html.push('<div class="card sharer-card">');
        html.push(`<div class="est-icon">${esc(initial)}</div>`);
        html.push('<div class="text">');
        html.push(`<div class="estate">${esc(estName)}</div>`);
        if (sharer.name || sharer.position) {
          html.push('<div class="person">');
          if (sharer.name) html.push(`<span>${esc(sharer.name)} 담당자</span>`);
          if (sharer.position) html.push(`<span class="position-badge">${esc(sharer.position)}</span>`);
          html.push('</div>');
        }
        html.push('</div></div>');
      }

      // 2026-05-25 [사용자 명시] 작업 5 — 현장 이름 + 주소 (제일 위), 뱃지 그 밑, 분류·지역 칩.
      html.push('<div class="card">');
      html.push(`<h1 class="title">${esc(d.title || '분양 현장')}</h1>`);
      if (d.address) html.push(`<p class="address">📍 ${esc(d.address)}</p>`);
      if (badges.length > 0) {
        html.push('<div class="badge-row">');
        badges.forEach((b) => html.push(`<span class="badge">${esc(b)}</span>`));
        html.push('</div>');
      }
      html.push(`<div class="meta-row"><span class="meta-chip">${esc(CATEGORIES[d.category] || '분양 현장')}</span>${d.region ? `<span class="meta-chip">${esc(d.region)}${d.sigungu ? ' · ' + esc(d.sigungu) : ''}</span>` : ''}</div>`);
      html.push('</div>');

      // 2026-05-25 [사용자 명시] 작업 3 — 사진 썸네일 (클릭 시 lightbox).
      if (imgs.length > 0) {
        html.push('<div class="gallery" id="thumbGallery">');
        imgs.forEach((u, i) => html.push(`<img src="${escAttr(u)}" alt="" loading="lazy" data-idx="${i}" />`));
        html.push('</div>');
      }

      // 현장 정보
      const specRows = [];
      const priceText = formatPriceRange(Number(d.priceMin) || 0, Number(d.priceMax) || 0);
      if (priceText) specRows.push(['현장가격', priceText]);
      if (d.rooms != null || d.bathrooms != null) {
        const parts = [];
        if (d.rooms != null) parts.push(`방 ${d.rooms}개`);
        if (d.bathrooms != null) parts.push(`욕실 ${d.bathrooms}개`);
        specRows.push(['방/욕실', parts.join(' · ')]);
      }
      const floorText = formatFloor(d.floorMin, d.floorMax);
      if (floorText) specRows.push(['최저층/최고층', floorText]);
      if (d.parkingCount != null) specRows.push(['주차', `${d.parkingCount}대`]);
      if (d.heatingType) specRows.push(['난방', String(d.heatingType)]);
      if (specRows.length > 0 || options.length > 0) {
        html.push('<div class="section-label">현장 정보</div><div class="card">');
        specRows.forEach(([l, v]) => html.push(`<div class="info-row"><span class="info-label">${esc(l)}</span><span class="info-value">${esc(v)}</span></div>`));
        if (options.length > 0) {
          html.push('<div class="info-row" style="align-items:flex-start"><span class="info-label" style="padding-top:4px">옵션</span><div class="chip-list">');
          options.forEach((o) => html.push(`<span class="chip">${esc(o)}</span>`));
          html.push('</div></div>');
        }
        html.push('</div>');
      }

      // 영상
      if (vids.length > 0) {
        html.push('<div class="section-label">현장 영상</div><div class="gallery">');
        vids.forEach((u) => html.push(`<video src="${escAttr(u)}" controls preload="metadata"></video>`));
        html.push('</div>');
      }

      // 속지
      if (innerPages.length > 0) {
        html.push('<div class="section-label">속지</div>');
        innerPages.forEach((u, i) => html.push(`<a class="file-btn" href="${escAttr(u)}" target="_blank" rel="noopener">📄 속지 ${i + 1} 보기</a>`));
      }

      // 손님 공유용 자료
      if (customerFiles.length > 0) {
        html.push('<div class="section-label">자료</div>');
        customerFiles.forEach((u, i) => html.push(`<a class="file-btn" href="${escAttr(u)}" target="_blank" rel="noopener">📎 자료 ${i + 1} 보기</a>`));
      }

      // 2026-05-25 [사용자 명시] 작업 6 — 최하단 담당자 연락처 (부동산 담당자 + 분양대행사 담당자).
      const sharerPhone = sharer && sharer.phone ? digitsOnly(sharer.phone) : '';
      const advName = d.managerName || d.advertiser || '';
      const advPhone = d.managerPhone ? digitsOnly(d.managerPhone) : '';
      if (sharerPhone || advPhone) {
        html.push('<div class="section-label">담당자 연락처</div><div class="contact-section">');
        if (sharer && sharerPhone) {
          html.push('<div class="contact-card">');
          html.push('<span class="contact-label">부동산 담당자</span>');
          html.push(`<div class="contact-name">${esc(sharer.name || '담당자')}${sharer.position ? ` <span class="position-badge">${esc(sharer.position)}</span>` : ''}</div>`);
          if (sharer.estateName) html.push(`<div class="contact-sub">${esc(sharer.estateName)}</div>`);
          html.push('<div class="contact-actions">');
          html.push(`<a class="contact-btn contact-btn--call" href="tel:${escAttr(sharerPhone)}">📞 전화하기</a>`);
          html.push(`<a class="contact-btn contact-btn--sms" href="sms:${escAttr(sharerPhone)}">💬 문자하기</a>`);
          html.push('</div></div>');
        }
        if (advPhone || advName) {
          html.push('<div class="contact-card">');
          html.push('<span class="contact-label contact-label--ad">분양대행사 담당자</span>');
          html.push(`<div class="contact-name">${esc(advName || '담당자')}</div>`);
          if (d.advertiser && d.advertiser !== advName) {
            html.push(`<div class="contact-sub">${esc(d.advertiser)}</div>`);
          }
          if (advPhone) {
            html.push('<div class="contact-actions">');
            html.push(`<a class="contact-btn contact-btn--call" href="tel:${escAttr(advPhone)}">📞 전화하기</a>`);
            html.push(`<a class="contact-btn contact-btn--sms" href="sms:${escAttr(advPhone)}">💬 문자하기</a>`);
            html.push('</div>');
          }
          html.push('</div>');
        }
        html.push('</div>');
      }

      html.push('<p class="expire-note">공유받은 링크는 발급 시점 기준 24시간 후 만료됩니다.</p>');

      root.innerHTML = html.join('');

      // 2026-05-25 [사용자 명시] 작업 3 — 썸네일 클릭 시 lightbox 오픈 (가로 스크롤 + 좌우 화살표).
      bindLightbox(imgs);
    }

    // ─── Lightbox ─────────────────────────────────────
    const lightbox = document.getElementById('lightbox');
    const lightboxScroller = document.getElementById('lightboxScroller');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');
    let lbImgs = [];
    let lbIdx = 0;

    function openLightbox(idx) {
      if (!lbImgs.length) return;
      lbIdx = Math.max(0, Math.min(idx, lbImgs.length - 1));
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      // 스크롤 위치 = lbIdx * 화면 너비
      requestAnimationFrame(() => {
        lightboxScroller.scrollTo({ left: lbIdx * lightboxScroller.clientWidth, behavior: 'auto' });
        updateCounter();
      });
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    function updateCounter() {
      if (!lbImgs.length) return;
      lightboxCounter.textContent = `${lbIdx + 1} / ${lbImgs.length}`;
    }
    function goTo(delta) {
      if (!lbImgs.length) return;
      const len = lbImgs.length;
      lbIdx = ((lbIdx + delta) % len + len) % len;
      lightboxScroller.scrollTo({ left: lbIdx * lightboxScroller.clientWidth, behavior: 'smooth' });
      updateCounter();
    }
    lightboxClose.addEventListener('click', closeLightbox);
    lightboxPrev.addEventListener('click', () => goTo(-1));
    lightboxNext.addEventListener('click', () => goTo(1));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    lightboxScroller.addEventListener('scroll', () => {
      const w = lightboxScroller.clientWidth || 1;
      const i = Math.round(lightboxScroller.scrollLeft / w);
      if (i !== lbIdx) { lbIdx = i; updateCounter(); }
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') goTo(-1);
      else if (e.key === 'ArrowRight') goTo(1);
    });

    function bindLightbox(imgs) {
      lbImgs = imgs.slice();
      lightboxScroller.innerHTML = lbImgs
        .map((u) => `<div class="lightbox-slide"><img src="${esc(u)}" alt="" /></div>`)
        .join('');
      // 썸네일 클릭 바인딩
      const thumbs = document.querySelectorAll('#thumbGallery img');
      thumbs.forEach((el) => {
        el.addEventListener('click', () => {
          const idx = Number(el.getAttribute('data-idx')) || 0;
          openLightbox(idx);
        });
      });
    }

    function renderError(msg) {
      root.innerHTML = `
        <div class="err">
          <div class="icon">⏰</div>
          <h2>${esc(msg)}</h2>
          <p>다시 공유받으시거나, 공유해주신 분께 문의해주세요.</p>
        </div>
      `;
    }
  })();
  </script>
</body>
</html>
