<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>부비서 — 회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --primary:#6155F5; --grad:linear-gradient(135deg,#6155F5 0%,#39AFFD 100%);
      --ink:#191F28; --sub:#6B7684; --tert:#8B95A1; --line:#E5E8EB;
      --bg:#F2F4F6; --card:#FFFFFF; --soft:#F7F8FA; --tint:#EEF0FE;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.3px;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    a{text-decoration:none;color:inherit;}
    .box{width:100%;max-width:460px;background:var(--card);border:1px solid rgba(150,160,200,.14);border-radius:26px;box-shadow:0 24px 70px rgba(40,50,90,.12);padding:40px 34px 34px;}
    .logo{text-align:center;font-size:25px;font-weight:900;letter-spacing:-1px;display:block;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
    h1{text-align:center;font-size:20px;font-weight:800;margin:18px 0 4px;letter-spacing:-.6px;}
    .tag{text-align:center;font-size:14px;color:var(--sub);font-weight:500;margin:0 0 26px;}

    .opt{display:flex;align-items:center;gap:15px;width:100%;background:var(--soft);border:1.6px solid transparent;border-radius:18px;padding:20px 20px;margin-bottom:13px;cursor:pointer;transition:.16s;text-align:left;}
    .opt:hover{border-color:var(--primary);background:#fff;box-shadow:0 12px 30px rgba(97,85,245,.12);transform:translateY(-1px);}
    .opt .ic{width:52px;height:52px;border-radius:15px;flex:0 0 auto;display:grid;place-items:center;color:#fff;}
    .opt.broker .ic{background:var(--grad);}
    .opt.adv .ic{background:linear-gradient(135deg,#0A7A55 0%,#13C28A 100%);}
    .opt .tx{flex:1;min-width:0;}
    .opt .tt{font-size:17px;font-weight:800;letter-spacing:-.4px;}
    .opt .ds{font-size:13px;color:var(--sub);font-weight:500;margin-top:4px;line-height:1.5;}
    .opt .ar{color:var(--tert);flex:0 0 auto;}

    .foot{text-align:center;margin-top:22px;font-size:13.5px;color:var(--tert);font-weight:500;}
    .foot a{color:var(--primary);font-weight:700;}
  </style>
</head>
<body>
  <div class="box">
    <a class="logo" href="/">부비서</a>
    <h1>어떤 회원가입을 하시나요?</h1>
    <p class="tag">가입 유형을 선택해주세요.</p>

    <a class="opt broker" href="broker/index.html">
      <span class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>
      </span>
      <span class="tx">
        <span class="tt">중개사무소 회원가입</span>
        <span class="ds">공인중개사 대표자·직원 — 부비서 앱 계정을 만들어요.</span>
      </span>
      <span class="ar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </a>

    <a class="opt adv" href="advertiser/index.html">
      <span class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 14v-3zM11.6 16.8a3 3 0 11-5.8-1.6"/></svg>
      </span>
      <span class="tx">
        <span class="tt">광고사·분양대행사 회원가입</span>
        <span class="ds">부비서 앱에 광고·분양 현장을 등록하는 업체용이에요.</span>
      </span>
      <span class="ar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
    </a>

    <p class="foot">이미 계정이 있으신가요? <a href="../login/index.html">로그인</a></p>
  </div>
</body>
</html>
