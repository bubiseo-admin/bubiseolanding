<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>영업 지도 관리자</title>
  <style>
    :root {
      --signup: #00C896; --delivered: #FFB020; --revisit: #3B82F6; --fail: #EF4444;
      --ink: #191F28; --sub: #6B7684; --line: #E5E8EB; --bg: #F2F4F6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); }
    /* 전체화면 지도 */
    #admMap { position: fixed; inset: 0; background: #E9EEF3; }
    /* 게이트 */
    #gate { position: fixed; inset: 0; z-index: 9000; background: linear-gradient(160deg,#3D4452,#191F28); display: flex; align-items: center; justify-content: center; padding: 24px; }
    #gate .card { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 28px 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    #gate h1 { font-size: 19px; margin: 0 0 6px; }
    #gate p { font-size: 13px; color: var(--sub); margin: 0 0 18px; }
    #gate input { width: 100%; height: 52px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; text-align: center; outline: none; }
    #gate input:focus { border-color: #6155F5; }
    #gate button { width: 100%; height: 50px; margin-top: 14px; border: none; border-radius: 12px; background: #191F28; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    #gateErr { color: var(--fail); font-size: 13px; min-height: 18px; margin-top: 8px; font-weight: 600; }
    /* 좌측 상단 시/도 집계 (서울 / 경기 — 전체·가입·전달·재방문·실패) */
    #summaryBar { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; z-index: 600; background: rgba(255,255,255,.97); border-radius: 12px; box-shadow: 0 3px 14px rgba(0,0,0,.16); padding: 8px 10px; }
    .ss-tbl { border-collapse: collapse; font-size: 11px; }
    .ss-tbl th, .ss-tbl td { padding: 2px 6px; text-align: right; white-space: nowrap; }
    .ss-tbl thead th { font-size: 10px; font-weight: 800; color: var(--sub); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .ss-tbl thead th.c-s { color: var(--signup); } .ss-tbl thead th.c-d { color: #C98A00; }
    .ss-tbl thead th.c-r { color: var(--revisit); } .ss-tbl thead th.c-f { color: var(--fail); }
    .ss-tbl tbody th { text-align: left; font-weight: 800; font-size: 12px; color: var(--ink); padding-top: 4px; }
    .ss-tbl tbody td { font-weight: 800; font-size: 12px; color: var(--ink); padding-top: 4px; }
    /* 우측 상단 새로고침 */
    #reloadBtn { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: 10px; z-index: 600; width: 44px; height: 44px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.22); font-size: 20px; color: #191F28; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #reloadBtn.spin { animation: mr-spin .6s linear; }
    @keyframes mr-spin { to { transform: rotate(360deg); } }
    /* 하단 안내 토스트 */
    #mapMsg { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 50%; transform: translateX(-50%); z-index: 600; background: rgba(25,31,40,.85); color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 999px; white-space: nowrap; pointer-events: none; }
    #mapMsg:empty { display: none; }
    /* 지도 박스 — 4종(가입 초록 / 전달 노랑 / 재방문 파랑 / 실패 빨강) + 박스 위 담당 직원 이름 */
    .adm-pin { display: flex; flex-direction: column; align-items: center; gap: 3px; transform: translateY(-6px); }
    .adm-name { background: #191F28; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 9px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.3); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    .adm-box { border-radius: 9px; padding: 5px 9px; box-shadow: 0 3px 10px rgba(0,0,0,.28); font-size: 11px; line-height: 1.25; text-align: center; white-space: nowrap; border: 1.5px solid transparent; }
    .adm-box b { display: block; font-size: 12px; font-weight: 800; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .adm-box .ab-sub { display: block; font-size: 10px; font-weight: 700; }
    .adm-box.SIGNUP { background: var(--signup); border-color: var(--signup); color: #fff; }
    .adm-box.SIGNUP .ab-sub { color: rgba(255,255,255,.92); }
    .adm-box.DELIVERED { background: var(--delivered); border-color: var(--delivered); color: #4A3A00; }
    .adm-box.DELIVERED .ab-sub { color: #6B5200; }
    .adm-box.REVISIT { background: var(--revisit); border-color: var(--revisit); color: #fff; }
    .adm-box.REVISIT .ab-sub { color: rgba(255,255,255,.92); }
    .adm-box.FAIL { background: var(--fail); border-color: var(--fail); color: #fff; }
    .adm-box.FAIL .ab-sub { color: rgba(255,255,255,.92); }
    /* 검색 — 우측 하단 돋보기 FAB + 검색 패널 */
    #searchFab { position: fixed; right: 20px; bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 700; width: 54px; height: 54px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.26); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #searchFab:active { transform: scale(.94); }
    #searchPanel { position: fixed; right: 84px; bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 700; width: 300px; max-width: calc(100vw - 98px); background: transparent; display: none; }
    #searchPanel.on { display: block; }
    .sp-head { display: flex; align-items: center; background: #fff; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
    .sp-head:focus-within { box-shadow: 0 4px 16px rgba(0,0,0,.18), 0 0 0 2px rgba(97,85,245,.35); }
    .sp-head input { flex: 1; min-width: 0; height: 46px; border: none; background: transparent; padding: 0 4px 0 18px; font-size: 15px; outline: none; }
    .sp-head .sp-x { border: none; background: none; font-size: 17px; color: var(--sub); cursor: pointer; padding: 0 15px 0 4px; }
    #searchResults { max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #searchResults:not(:empty) { background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.16); margin-bottom: 8px; }
    .sr-item { padding: 11px 14px; border-bottom: 1px solid #F2F4F6; cursor: pointer; }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:active { background: #F2F4F6; }
    .sr-name { font-size: 14px; font-weight: 800; }
    .sr-name .sr-badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; color: #fff; }
    .sr-sub { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.45; }
    .sr-nogeo { color: var(--fail); font-weight: 700; }
    .sr-empty { padding: 18px 14px; text-align: center; color: #B0B8C1; font-size: 13px; }
    /* 검색 결과 핀 (지도 이동 시 강조) */
    .search-pin { display: flex; flex-direction: column; align-items: center; transform: translateY(-3px); }
    .search-pin .sp-label { background: #6155F5; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; box-shadow: 0 3px 10px rgba(97,85,245,.5); white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .search-pin .sp-dot { width: 14px; height: 14px; border-radius: 50%; background: #6155F5; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(97,85,245,.3), 0 2px 6px rgba(0,0,0,.4); }
  </style>
</head>
<body>
  <div id="admMap"></div>

  <div id="summaryBar">
    <table class="ss-tbl">
      <thead>
        <tr><th></th><th>전체</th><th class="c-s">가입</th><th class="c-d">전달</th><th class="c-r">재방문</th><th class="c-f">실패</th></tr>
      </thead>
      <tbody>
        <tr><th>서울</th><td id="ssSeoulTotal">-</td><td id="ssSeoulSignup">-</td><td id="ssSeoulDeliv">-</td><td id="ssSeoulRevisit">-</td><td id="ssSeoulFail">-</td></tr>
        <tr><th>경기</th><td id="ssGgTotal">-</td><td id="ssGgSignup">-</td><td id="ssGgDeliv">-</td><td id="ssGgRevisit">-</td><td id="ssGgFail">-</td></tr>
      </tbody>
    </table>
  </div>
  <button id="reloadBtn" title="새로고침">↻</button>
  <div id="mapMsg"></div>

  <button id="searchFab" title="검색"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.6" y1="16.6" x2="21" y2="21"/></svg></button>
  <div id="searchPanel">
    <div id="searchResults"></div>
    <div class="sp-head">
      <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="등록번호·대표자·상호명·주소 검색" />
      <button class="sp-x" id="searchClose">✕</button>
    </div>
  </div>

  <div id="gate">
    <div class="card">
      <h1>영업 지도 관리자</h1>
      <p>관리자 비밀번호를 입력해 주세요</p>
      <input id="gatePw" type="password" autocomplete="off" />
      <div id="gateErr"></div>
      <button id="gateBtn">들어가기</button>
    </div>
  </div>

  <script>
    var API = 'https://api.bubiseo.com';
    var token = sessionStorage.getItem('fieldmap_admin_token') || '';
    var ALL = [];
    var STATUS_LABEL = { SIGNUP: '가입완료', DELIVERED: '전달완료', REVISIT: '재방문', FAIL: '실패' };
    var STATUS_HEX = { SIGNUP: '#00C896', DELIVERED: '#FFB020', REVISIT: '#3B82F6', FAIL: '#EF4444' };
    var admMap = null, admOverlays = [], sdkReadyPromise = null, searchTimer = null, searchPin = null;

    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function authHeaders(){ return { Authorization: 'Bearer ' + token }; }

    // ===== 게이트 =====
    function showGate(msg){ $('gate').style.display='flex'; if(msg) $('gateErr').textContent=msg; $('gatePw').value=''; $('gatePw').focus(); }
    function hideGate(){ $('gate').style.display='none'; }
    $('gateBtn').onclick = doAuth;
    $('gatePw').addEventListener('keydown', function(e){ if(e.key==='Enter') doAuth(); });
    function doAuth(){
      var pw = $('gatePw').value.trim(); if(!pw) return; $('gateErr').textContent='';
      fetch(API+'/fieldmap/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
        .then(function(r){ if(!r.ok) throw new Error('pw'); return r.json(); })
        .then(function(j){
          if(j.scope!=='admin'){ $('gateErr').textContent='관리자 비밀번호가 아니에요'; return; }
          token=j.token; sessionStorage.setItem('fieldmap_admin_token',token); hideGate(); boot();
        })
        .catch(function(){ $('gateErr').textContent='비밀번호가 올바르지 않아요'; $('gatePw').value=''; });
    }

    // ===== 시/도 집계 =====
    function fillSido(key, s){
      $('ss'+key+'Total').textContent = ((s&&s.total)||0).toLocaleString('ko-KR');
      $('ss'+key+'Signup').textContent = ((s&&s.signup)||0).toLocaleString('ko-KR');
      $('ss'+key+'Deliv').textContent = ((s&&s.delivered)||0).toLocaleString('ko-KR');
      $('ss'+key+'Revisit').textContent = ((s&&s.revisit)||0).toLocaleString('ko-KR');
      $('ss'+key+'Fail').textContent = ((s&&s.fail)||0).toLocaleString('ko-KR');
    }
    function loadSummary(){
      fetch(API+'/fieldmap/admin/summary', { headers: authHeaders() })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if(!j || !j.summary) return;
          var seoul=null, gg=null;
          j.summary.forEach(function(s){ if(s.sido==='서울특별시') seoul=s; else if(s.sido==='경기도') gg=s; });
          fillSido('Seoul', seoul); fillSido('Gg', gg);
        })
        .catch(function(){});
    }

    // ===== 로드 =====
    $('reloadBtn').onclick = function(){
      var b=$('reloadBtn'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
      load();
    };
    function load(){
      loadSummary();
      fetch(API+'/fieldmap/admin/offices', { headers: authHeaders() })
        .then(function(r){ if(r.status===403){ showGate('다시 로그인해 주세요'); throw new Error('403'); } return r.json(); })
        .then(function(j){ ALL = j.offices || []; renderAdminMap(); })
        .catch(function(e){ if(String(e.message)!=='403') $('mapMsg').textContent='불러오기 실패'; });
    }

    // ===== Kakao SDK =====
    function ensureKakaoReady(){
      if(sdkReadyPromise) return sdkReadyPromise;
      sdkReadyPromise = new Promise(function(resolve, reject){
        if(typeof kakao!=='undefined' && kakao.maps && kakao.maps.LatLng){ resolve(); return; }
        fetch(API + '/public/presale-inquiry/kakao-js-key')
          .then(function(r){ if(!r.ok) throw new Error('키 fetch 실패'); return r.json(); })
          .then(function(j){
            var key = j && j.kakaoJsKey; if(!key) throw new Error('키 없음');
            var s = document.createElement('script');
            s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&libraries=services&autoload=false';
            s.onload = function(){ if(typeof kakao==='undefined' || !kakao.maps){ reject(new Error('kakao.maps 없음')); return; } kakao.maps.load(function(){ resolve(); }); };
            s.onerror = function(){ reject(new Error('SDK 로드 실패')); };
            document.head.appendChild(s);
          })
          .catch(reject);
      });
      return sdkReadyPromise;
    }

    function initAdminMap(){
      admMap = new kakao.maps.Map($('admMap'), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 9 });
    }

    function boot(){
      $('mapMsg').textContent = '지도 불러오는 중…';
      ensureKakaoReady()
        .then(function(){ initAdminMap(); load(); })
        .catch(function(){ $('mapMsg').textContent = '지도 로드 실패'; });
    }

    // ===== 지도 렌더 (가입 초록 / 전달 노랑 / 재방문 파랑 / 실패 빨강) =====
    function renderAdminMap(){
      if(!admMap) return;
      admOverlays.forEach(function(o){ o.setMap(null); }); admOverlays = [];
      var Z = { SIGNUP: 5, DELIVERED: 4, REVISIT: 3, FAIL: 2 };
      var rows = ALL.filter(function(o){ return STATUS_LABEL[o.status] && o.lat!=null && o.lng!=null; });
      var bounds = new kakao.maps.LatLngBounds(), has=false;
      rows.forEach(function(o){
        var ll = new kakao.maps.LatLng(o.lat, o.lng);
        var nameTag = o.managerName ? '<div class="adm-name">' + esc(o.managerName) + '</div>' : '';
        var el = document.createElement('div');
        el.className = 'adm-pin';
        el.innerHTML = nameTag + '<div class="adm-box ' + o.status + '"><b>' + esc(o.name) + '</b><span class="ab-sub">' + STATUS_LABEL[o.status] + '</span></div>';
        var ov = new kakao.maps.CustomOverlay({ position: ll, content: el, xAnchor: 0.5, yAnchor: 1, zIndex: Z[o.status] || 2 });
        ov.setMap(admMap); admOverlays.push(ov);
        bounds.extend(ll); has=true;
      });
      if(has) admMap.setBounds(bounds);
      $('mapMsg').textContent = rows.length===0 ? '표시할 영업 기록이 아직 없어요.' : '';
    }

    // ===== 검색 (등록번호/대표자/상호명/주소 → 지도 20m 이동) =====
    $('searchFab').onclick = function(){
      var p = $('searchPanel'); p.classList.toggle('on');
      if(p.classList.contains('on')) setTimeout(function(){ $('searchInput').focus(); }, 50);
    };
    $('searchClose').onclick = function(){ $('searchPanel').classList.remove('on'); };
    $('searchInput').addEventListener('input', function(){
      if(searchTimer) clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 280);
    });
    $('searchInput').addEventListener('keydown', function(e){
      if(e.key==='Enter'){ if(searchTimer) clearTimeout(searchTimer); doSearch(); }
    });

    function doSearch(){
      var q = $('searchInput').value.trim();
      if(!q){ $('searchResults').innerHTML = ''; return; }
      $('searchResults').innerHTML = '<div class="sr-empty">검색 중…</div>';
      fetch(API+'/fieldmap/search?q='+encodeURIComponent(q), { headers: authHeaders() })
        .then(function(r){ if(r.status===403){ showGate('다시 로그인해 주세요'); throw new Error('403'); } return r.ok ? r.json() : { results: [] }; })
        .then(function(j){ renderSearchResults(j.results || []); })
        .catch(function(e){ if(String(e.message)!=='403') $('searchResults').innerHTML = '<div class="sr-empty">검색 실패</div>'; });
    }

    function renderSearchResults(rows){
      if(!rows.length){ $('searchResults').innerHTML = '<div class="sr-empty">검색 결과가 없어요</div>'; return; }
      var html = '';
      rows.forEach(function(o, i){
        var addr = o.roadAddress || o.jibunAddress || '';
        var noGeo = (o.lat==null || o.lng==null);
        var badge = o.status ? '<span class="sr-badge" style="background:'+STATUS_HEX[o.status]+(o.status==='DELIVERED'?';color:#4A3A00':'')+'">'+STATUS_LABEL[o.status]+'</span>' : '';
        html += '<div class="sr-item" data-i="'+i+'">'
          + '<div class="sr-name">'+esc(o.name)+badge+'</div>'
          + '<div class="sr-sub">'+(o.ownerName?esc(o.ownerName)+' · ':'')+(o.regNo?esc(o.regNo):'')+(addr?'<br>'+esc(addr):'')+(noGeo?'<br><span class="sr-nogeo">좌표 없음 — 지도 이동 불가</span>':'')+'</div>'
          + '</div>';
      });
      $('searchResults').innerHTML = html;
      Array.prototype.forEach.call($('searchResults').querySelectorAll('.sr-item'), function(el){
        el.onclick = function(){ gotoOffice(rows[Number(el.getAttribute('data-i'))]); };
      });
    }

    function setSearchPin(o, ll){
      if(searchPin) searchPin.setMap(null);
      var el = document.createElement('div');
      el.className = 'search-pin';
      el.innerHTML = '<div class="sp-label">'+esc(o.name)+'</div><div class="sp-dot"></div>';
      searchPin = new kakao.maps.CustomOverlay({ position: ll, content: el, xAnchor: 0.5, yAnchor: 1, zIndex: 99 });
      searchPin.setMap(admMap);
    }

    function gotoOffice(o){
      if(o.lat==null || o.lng==null){ alert('이 부동산은 좌표가 없어 지도 이동이 불가해요.'); return; }
      if(!admMap){ alert('지도를 불러오는 중이에요. 잠시 후 다시 시도해 주세요.'); return; }
      $('searchPanel').classList.remove('on');
      var ll = new kakao.maps.LatLng(o.lat, o.lng);
      admMap.setLevel(1);            // 약 20m 뷰 (가장 가까이)
      admMap.setCenter(ll);
      setSearchPin(o, ll);
    }

    // ===== 시작 =====
    if(token) { hideGate(); boot(); } else { showGate(); }
  </script>
</body>
</html>
