<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>부동산 영업 지도</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      /* 박스 상태색 — 가입완료 초록 / 전달완료 파랑 / 재방문 노랑 / 실패 빨강 */
      --signup: #00C896; --delivered: #3B82F6; --revisit: #FFB020; --fail: #EF4444;
      --blueGrad: linear-gradient(135deg,#6155F5,#39AFFD);
      --ink: #191F28; --sub: #6B7684; --line: #E5E8EB; --bg: #F2F4F6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: var(--ink); background: #fff; }
    /* 세이프에어리어(노치·홈바) 흰색 채움 */
    #safeBottom { position: fixed; bottom: 0; left: 0; right: 0; height: env(safe-area-inset-bottom); background: #fff; z-index: 9500; pointer-events: none; }
    /* 세이프에리어 포함 화면 꽉차게 */
    #map { position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100dvh; }
    /* 비번 게이트 */
    #gate { position: fixed; inset: 0; z-index: 9000; background: linear-gradient(160deg,#6155F5,#39AFFD); display: flex; align-items: center; justify-content: center; padding: 24px; }
    #gate .card { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 28px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); text-align: center; }
    #gate h1 { font-size: 19px; margin: 0 0 6px; }
    #gate p { font-size: 13px; color: var(--sub); margin: 0 0 18px; }
    #gate input { width: 100%; height: 52px; border: 1px solid var(--line); border-radius: 12px; font-size: 17px; text-align: center; outline: none; margin-bottom: 8px; box-sizing: border-box; }
    #gate input:focus { border-color: #6155F5; }
    #gate #gateBtn { width: 100%; height: 50px; margin-top: 8px; border: none; border-radius: 12px; background: linear-gradient(135deg,#6155F5,#39AFFD); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    #gate #gateBack { width: 100%; height: 40px; margin-top: 6px; border: none; background: none; color: var(--sub); font-size: 13px; font-weight: 700; cursor: pointer; }
    #gateErr { color: var(--fail); font-size: 13px; min-height: 18px; margin-top: 8px; font-weight: 600; }
    /* 하단 안내칩 (지역바가 상단을 쓰므로 아래로) */
    #hint { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 50%; transform: translateX(-50%); z-index: 500; background: rgba(25,31,40,.82); color: #fff; font-size: 12px; padding: 7px 14px; border-radius: 11px; pointer-events: none; max-width: 90vw; text-align: center; }
    /* 지역 버튼 바 (상단) */
    #regionbar { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; right: 8px; z-index: 600; }
    #regionRows { max-width: calc(100% - 132px); }
    #incentiveBadge { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 8px; z-index: 650; display: none; align-items: center; gap: 6px; background: #fff; border: 1.5px solid #6155F5; border-radius: 11px; padding: 7px 12px; box-shadow: 0 3px 12px rgba(97,85,245,.22); }
    #incentiveBadge.on { display: inline-flex; }
    #incentiveBadge .ib-label { font-size: 10.5px; font-weight: 700; color: #6155F5; white-space: nowrap; }
    #incentiveBadge .ib-amt { font-size: 13px; font-weight: 900; color: #191F28; white-space: nowrap; }
    #accountInfo { position: fixed; top: calc(env(safe-area-inset-top) + 50px); right: 8px; z-index: 650; display: none; background: rgba(255,255,255,.95); border: 1px solid #E5E8EB; border-radius: 11px; padding: 4px 11px; box-shadow: 0 2px 8px rgba(0,0,0,.16); font-size: 11px; font-weight: 800; color: #191F28; white-space: nowrap; }
    #accountInfo.on { display: block; }
    /* 2026-06-05 [사용자 명시] 서울/경기 세로 2줄 + 줄마다 [구 선택]·[동 선택] 팝오버 */
    .rrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .rr-sido { flex: 0 0 auto; max-width: none; background: #6155F5; color: #fff; font-weight: 800; }
    .rr-pick { flex: 0 1 auto; max-width: 44%; min-width: 0; border: none; border-radius: 11px; padding: 10px 16px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.96); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
    .rr-pick.on { background: #6155F5; color: #fff; }
    .rr-pick.ph { color: var(--sub); }
    .rr-pick:disabled { background: #fff; color: var(--sub); cursor: default; }
    #rPop { position: fixed; z-index: 700; max-height: 52vh; overflow-y: auto; background: #fff; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3); padding: 6px; min-width: 150px; -webkit-overflow-scrolling: touch; }
    #rPop button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 11px 13px; font-size: 14px; color: var(--ink); border-radius: 9px; cursor: pointer; white-space: nowrap; }
    #rPop button.on { background: #F0EEFF; color: #6155F5; font-weight: 800; }
    #rPop .rp-cnt { float: right; color: var(--sub); font-weight: 600; font-size: 12px; margin-left: 14px; }
    /* 내 위치 버튼 (우하단) */
    #locBtn { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 56px); z-index: 550; width: 46px; height: 46px; border-radius: 14px; border: none; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.28); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #locBtn:active { transform: scale(.94); }
    #locBtn.loading svg { display: none; }
    #locBtn.loading::after { content: ''; width: 18px; height: 18px; border: 2.5px solid #E5E8EB; border-top-color: #191F28; border-radius: 50%; animation: loc-spin .7s linear infinite; }
    @keyframes loc-spin { to { transform: rotate(360deg); } }
    #logoutBtn { position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom) + 56px); z-index: 550; width: 46px; height: 46px; border-radius: 14px; border: none; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.28); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #logoutBtn:active { transform: scale(.94); }
    /* 검색 — 우측 하단 돋보기 FAB(내위치 버튼 위) + 검색 패널 */
    #searchFab { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 110px); z-index: 555; width: 46px; height: 46px; border-radius: 14px; border: none; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.28); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #searchFab:active { transform: scale(.94); }
    #searchPanel { position: fixed; right: 70px; bottom: calc(env(safe-area-inset-bottom) + 110px); z-index: 1200; width: 300px; max-width: calc(100vw - 84px); background: transparent; display: none; }
    #searchPanel.on { display: block; }
    .sp-head { display: flex; align-items: center; background: #fff; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
    .sp-head:focus-within { box-shadow: 0 4px 16px rgba(0,0,0,.18), 0 0 0 2px rgba(97,85,245,.35); }
    .sp-head input { flex: 1; min-width: 0; height: 46px; border: none; background: transparent; padding: 0 4px 0 18px; font-size: 16px; outline: none; }
    .sp-head .sp-x { border: none; background: none; font-size: 17px; color: var(--sub); cursor: pointer; padding: 0 15px 0 4px; }
    #searchResults { max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #searchResults:not(:empty) { background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.16); margin-bottom: 8px; }
    .sr-item { padding: 11px 14px; border-bottom: 1px solid #F2F4F6; cursor: pointer; }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:active { background: #F2F4F6; }
    .sr-name { font-size: 14px; font-weight: 800; }
    .sr-name .sr-badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: middle; color: #fff; }
    .sr-sub { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.45; }
    .sr-nogeo { color: var(--fail); font-weight: 700; }
    .sr-empty { padding: 18px 14px; text-align: center; color: #B0B8C1; font-size: 13px; }
    .search-pin { display: flex; flex-direction: column; align-items: center; transform: translateY(-3px); }
    .search-pin .sp-label { background: #6155F5; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; box-shadow: 0 3px 10px rgba(97,85,245,.5); white-space: nowrap; max-width: 170px; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .search-pin .sp-dot { width: 14px; height: 14px; border-radius: 50%; background: #6155F5; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(97,85,245,.3), 0 2px 6px rgba(0,0,0,.4); }
    .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #2D7FF9; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(45,127,249,.3), 0 2px 6px rgba(0,0,0,.3); }
    /* 부동산 박스 (CustomOverlay) — 블랙 집(건물) 아이콘 마커(실제 위치) 바로 위에 라벨 박스. 연결선 없음.
       동일 좌표 2곳 이상은 원형 숫자 배지(N) → 탭하면 옆에 팝오버 목록. */
    .pin-wrap { position: relative; width: 0; height: 0; }
    .pin-icon { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; background: #191F28; border: 2.5px solid #fff; box-shadow: 0 3px 9px rgba(0,0,0,.45); z-index: 2; display: flex; align-items: center; justify-content: center; }
    .pin-icon svg { width: 16px; height: 16px; display: block; }
    .office-box { position: absolute; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 9px; box-sizing: border-box; box-shadow: 0 4px 12px rgba(0,0,0,.22); font-size: 11px; line-height: 1.3; text-align: center; cursor: pointer; z-index: 3; }
    .office-box b { font-size: 12px; display: block; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .office-box .ob-sub { color: var(--sub); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 동일 좌표 N곳 묶음 — 블랙 원형 숫자 배지 + 캡션 (탭 → 옆 팝오버) */
    .cluster-badge { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; z-index: 4; }
    .cluster-badge .cb-circle { min-width: 38px; height: 38px; padding: 0 9px; border-radius: 999px; background: #191F28; border: 2.5px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.38); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; font-weight: 800; line-height: 1; }
    .cluster-badge .cb-cap { background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 800; color: #191F28; box-shadow: 0 2px 8px rgba(0,0,0,.2); white-space: nowrap; }
    /* 묶음 목록 — 박스 바로 옆 팝오버 */
    .cluster-pop { position: fixed; z-index: 1100; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.28); width: 232px; max-height: 60vh; overflow-y: auto; padding: 6px; }
    .cp-head { font-size: 12px; font-weight: 800; color: var(--ink); padding: 6px 8px 8px; border-bottom: 1px solid #F0F2F5; }
    .cp-list { padding-top: 4px; }
    .cp-row { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: none; background: #fff; border-radius: 8px; padding: 9px 8px; cursor: pointer; }
    .cp-row:active { background: #F2F4F7; }
    .cp-name { font-size: 13px; font-weight: 700; color: var(--ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cp-owner { font-size: 11px; color: var(--sub); flex: 0 0 auto; }
    .cp-stat { font-size: 10px; font-weight: 800; flex: 0 0 auto; }
    /* 완료된 곳: 행 배경을 상태 색으로 (지도 박스와 동일). 대비 — 재방문(amber)만 어두운 글자 */
    .cp-row.done .cp-name, .cp-row.done .cp-owner, .cp-row.done .cp-stat { color: #fff; }
    .cp-row.done.dark .cp-name, .cp-row.done.dark .cp-owner, .cp-row.done.dark .cp-stat { color: #4A3A00; }
    .pin-wrap.s-SIGNUP .office-box { background: var(--signup); border-color: var(--signup); }
    .pin-wrap.s-DELIVERED .office-box { background: var(--delivered); border-color: var(--delivered); }
    .pin-wrap.s-REVISIT .office-box { background: var(--revisit); border-color: var(--revisit); }
    .pin-wrap.s-FAIL .office-box { background: var(--fail); border-color: var(--fail); }
    .pin-wrap.s-SIGNUP .office-box *, .pin-wrap.s-REVISIT .office-box *, .pin-wrap.s-FAIL .office-box * { color: #fff !important; }
    .pin-wrap.s-DELIVERED .office-box * { color: #4A3A00 !important; }
    .pin-wrap.s-SIGNUP .pin-icon { background: var(--signup); }
    .pin-wrap.s-DELIVERED .pin-icon { background: var(--delivered); }
    .pin-wrap.s-REVISIT .pin-icon { background: var(--revisit); }
    .pin-wrap.s-FAIL .pin-icon { background: var(--fail); }
    /* ===== 중앙 모달 (부동산 상세) — 모바일 대시보드 디자인 (#F5F6F8 배경 · 흰 카드 · 소프트 그림자 0 5px 4px rgba(0,0,0,.08) · #191F28 텍스트 / #8B95A1 보조) ===== */
    #scrim { position: fixed; inset: 0; z-index: 1000; background: rgba(17,21,28,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
    #scrim.on { opacity: 1; pointer-events: auto; }
    #sheet { position: fixed; left: 50%; top: 50%; z-index: 1001; width: calc(100vw - 36px); max-width: 400px; max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #F5F6F8; border-radius: 22px; box-shadow: 0 24px 60px rgba(0,0,0,.32); transform: translate(-50%, -48%) scale(.96); opacity: 0; pointer-events: none; transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .18s; }
    #sheet.on { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    .sheet-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 30px; height: 30px; border: none; border-radius: 999px; background: #EDEFF2; color: #4E5968; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .sheet-x:active { background: #E2E5EA; }
    .sheet-pad { padding: 20px 18px 22px; }
    .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-right: 34px; }
    .sheet-name { font-size: 20px; font-weight: 800; color: #191F28; letter-spacing: -0.5px; flex: 1; min-width: 0; line-height: 1.3; }
    .sheet-actions { flex: 0 0 auto; display: flex; gap: 6px; }
    .btn-memo { flex: 0 0 auto; border: 1px solid #E5E8EB; background: #fff; color: #4E5968; font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .btn-reset { flex: 0 0 auto; border: 1px solid #FAD4D4; background: #FFF4F4; color: #E03E3E; font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
    .memo-box { margin-top: 12px; background: #FFF8E1; border: 1px solid #FFE9A8; border-radius: 12px; padding: 11px 13px; font-size: 13px; color: #5A4A1A; line-height: 1.5; white-space: pre-wrap; }
    .memo-edit { width: 100%; margin-top: 12px; min-height: 72px; border: 1px solid #E5E8EB; border-radius: 14px; padding: 12px 13px; font-size: 14px; color: var(--ink); line-height: 1.5; resize: vertical; outline: none; box-sizing: border-box; font-family: inherit; background: #fff; }
    .memo-edit:focus { border-color: #6155F5; }
    .memo-actions { display: flex; gap: 8px; margin-top: 10px; }
    .memo-cancel { flex: 1; height: 46px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: #8B95A1; font-size: 14px; font-weight: 700; cursor: pointer; }
    .memo-save { flex: 1.6; height: 46px; border: none; border-radius: 14px; background: var(--blueGrad); color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
    .sheet-meta { font-size: 13px; color: #8B95A1; margin-top: 8px; line-height: 1.6; }
    .sheet-meta a { color: #3B82F6; text-decoration: none; font-weight: 700; }
    .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-top: 10px; color: #fff; }
    /* 1행: 가입완료·전달완료 (시그니처 그라데이션 — 주요 액션) */
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 10px; }
    .status-grid button { height: 52px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; border: none; background: var(--blueGrad); color: #fff; box-shadow: 0 6px 14px rgba(97,85,245,.26); }
    .status-grid button:active { transform: scale(.97); }
    /* 2행: 길찾기(좌) | 재방문·실패(우 한 칸에 2개) — 흰 카드 타일 (대시보드 톤) */
    .act-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 6px; }
    .btn-route { height: 52px; border: 1px solid #E5E8EB; border-radius: 14px; background: #fff; color: #191F28; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; text-decoration: none; box-shadow: 0 5px 4px rgba(0,0,0,.08); }
    .btn-route:active { transform: scale(.97); }
    .sub2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sub2 button { height: 52px; border-radius: 14px; font-size: 13px; font-weight: 800; cursor: pointer; background: #fff; border: 1px solid #E5E8EB; box-shadow: 0 5px 4px rgba(0,0,0,.08); }
    .sub2 button:active { transform: scale(.97); }
    .sg-REVISIT { color: var(--revisit); }
    .sg-FAIL { color: var(--fail); }
    .hist-title { font-size: 13px; font-weight: 800; color: #8B95A1; margin: 18px 0 8px; }
    .hist-item { border-top: 1px solid #E5E8EB; padding: 11px 0; font-size: 13px; }
    .hist-item .hi-top { display: flex; justify-content: space-between; }
    .hist-item .hi-st { font-weight: 800; }
    .hist-item .hi-time { color: #8B95A1; font-size: 12px; }
    .hist-item .hi-photos { display: flex; gap: 6px; margin-top: 6px; }
    .hist-item .hi-photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
    .empty-hist { font-size: 13px; color: #B0B8C1; padding: 8px 0; }
    /* 액션 모달 (담당자/사진) */
    #modal, #geoAsk { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 22px; }
    #modal.on, #geoAsk.on { display: flex; }
    #geoAsk .m-card { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 22px; }
    #geoAsk h3 { margin: 0 0 4px; font-size: 17px; }
    #geoAsk .m-sub { font-size: 13px; color: var(--sub); margin: 0 0 16px; line-height: 1.5; }
    #modal .m-card { width: 100%; max-width: 380px; background: #fff; border-radius: 20px; padding: 22px; }
    #modal h3 { margin: 0 0 4px; font-size: 17px; }
    #modal .m-sub { font-size: 13px; color: var(--sub); margin: 0 0 16px; }
    #modal input[type=text] { width: 100%; height: 50px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; outline: none; }
    #modal input[type=text]:focus { border-color: #6155F5; }
    .photo-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .photo-slot { position: relative; aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--sub); font-size: 12px; cursor: pointer; overflow: hidden; background: var(--bg); }
    .photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .photo-slot .ps-ic { font-size: 24px; }
    .photo-slot input { display: none; }
    .photo-slot.filled { border-style: solid; border-color: #6155F5; }
    .m-actions { display: flex; gap: 8px; margin-top: 18px; }
    .m-actions .ghost { flex: 1; height: 48px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; font-weight: 700; color: var(--sub); cursor: pointer; }
    .m-actions .primary { flex: 1.4; height: 48px; border: none; border-radius: 12px; background: linear-gradient(135deg,#6155F5,#39AFFD); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; }
    .m-actions .primary:disabled { opacity: .45; }
    #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 5000; background: rgba(25,31,40,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="safeBottom"></div>
  <div id="map"></div>
  <div id="regionbar" style="display:none">
    <div id="regionRows"></div>
    <div id="rPop" style="display:none"></div>
  </div>
  <div id="incentiveBadge"><span class="ib-label">누적 인센티브</span><span class="ib-amt" id="ibAmt">0원</span></div>
  <div id="accountInfo"></div>
  <button id="locBtn" title="내 위치"><svg width="24" height="24" viewBox="0 0 24 24" fill="#191F28" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg></button>
  <button id="searchFab" title="검색"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.6" y1="16.6" x2="21" y2="21"/></svg></button>
  <button id="logoutBtn" title="로그아웃"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  <div id="searchPanel">
    <div id="searchResults"></div>
    <div class="sp-head">
      <input id="searchInput" type="text" inputmode="search" autocomplete="off" placeholder="등록번호·대표자·상호명·주소 검색" />
      <button class="sp-x" id="searchClose">✕</button>
    </div>
  </div>
  <div id="hint">로그인 중…</div>

  <!-- 비번 게이트 -->
  <div id="gate">
    <div class="card">
      <h1>부동산 영업 지도</h1>
      <p id="gateSub">아이디를 입력해 주세요</p>
      <input id="gateId" type="text" autocapitalize="off" autocomplete="username" placeholder="아이디" />
      <input id="gateName" type="text" autocomplete="name" placeholder="이름" style="display:none" />
      <input id="gatePw" type="password" autocomplete="current-password" placeholder="비밀번호" />
      <div id="gateErr"></div>
      <button id="gateBtn">다음</button>
      <button id="gateBack" style="display:none">← 아이디 다시 입력</button>
    </div>
  </div>

  <!-- 바텀시트 -->
  <div id="scrim"></div>
  <div id="sheet"><button id="sheetClose" class="sheet-x" aria-label="닫기">✕</button><div id="sheetBody" class="sheet-pad"></div></div>

  <!-- 액션 모달 (담당자 → 사진) -->
  <div id="modal">
    <div class="m-card">
      <div id="mStep1">
        <h3>담당자 이름</h3>
        <p class="m-sub">버튼을 누른 본인 이름을 입력해 주세요.</p>
        <input id="mName" type="text" placeholder="예: 이현우" />
        <div class="m-actions">
          <button class="ghost" data-mcancel>취소</button>
          <button class="primary" id="mNameNext">다음</button>
        </div>
      </div>
      <div id="mStep2" style="display:none">
        <h3>사진 등록</h3>
        <p class="m-sub" id="photoSub">매장사진과 명함사진을 등록해 주세요.</p>
        <div class="photo-slots">
          <label class="photo-slot" id="slot1">
            <span class="ps-ic">🏢</span><span>매장사진</span>
            <input type="file" accept="image/*" capture="environment" data-slot="1" />
          </label>
          <label class="photo-slot" id="slot2">
            <span class="ps-ic">💳</span><span>명함사진</span>
            <input type="file" accept="image/*" capture="environment" data-slot="2" />
          </label>
        </div>
        <div class="m-actions">
          <button class="ghost" data-mcancel>취소</button>
          <button class="primary" id="mSubmit" disabled>저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 위치 권한 안내 (로그인 직후) -->
  <div id="geoAsk">
    <div class="m-card">
      <h3>📍 내 위치 사용</h3>
      <p class="m-sub">현재 위치를 지도에 표시하면 가까운 부동산을 찾기 편해요. 위치 접근을 허용할까요?</p>
      <div class="m-actions">
        <button class="ghost" id="geoDeny">차단</button>
        <button class="primary" id="geoAllow">허용</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    var API = 'https://api.bubiseo.com';
    var token = sessionStorage.getItem('fieldmap_token') || '';
    var sdkReadyPromise = null;
    var map = null, clusterer = null;
    var markers = [];        // 클러스터용 마커
    var overlays = [];       // 박스 CustomOverlay (가까이서만)
    var officeCache = {};    // id -> office (목록 응답)
    var BOX_LEVEL = 3;       // 이 레벨 이하(가까움)면 박스 표시 (겹침 방지 위해 더 확대 필요)
    var renderTimer = null;
    // 지역 버튼 방식 — 기본 빈 지도, 버튼 누른 시군구만 로드.
    var REGIONS = [];        // [{sido, sigungu, count}]
    var activeSido = '';     // 현재 선택 시/도
    var REGION_SIDOS = [];   // 시도 목록 (시도 팝오버용)
    var loaded = {};         // sigungu -> offices[] (지도에 표시 중인 지역)
    var loadingSet = {};     // sigungu -> true (조회 중)
    var focusGu = '';        // 동 칩을 보여줄 시군구
    var dongFilter = '';     // 선택된 동(법정동) — 빈값=전체
    var meOverlay = null;    // 현재 내 위치 마커
    var myName = sessionStorage.getItem('fieldmap_name') || localStorage.getItem('fieldmap_manager') || ''; // 로그인 사용자 이름

    var STATUS_LABEL = { SIGNUP: '가입완료', DELIVERED: '전달완료', REVISIT: '재방문', FAIL: '실패' };
    var STATUS_COLOR = { SIGNUP: 'var(--signup)', DELIVERED: 'var(--delivered)', REVISIT: 'var(--revisit)', FAIL: 'var(--fail)' };

    function $(id) { return document.getElementById(id); }
    function toast(t, ms) { var el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(function(){ el.classList.remove('on'); }, ms || 1800); }
    function authHeaders(extra) { var h = extra || {}; h.Authorization = 'Bearer ' + token; return h; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function fmtTime(iso) { var d = new Date(iso); if (isNaN(d)) return ''; function p(n){return ('0'+n).slice(-2);} return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
    // 지번주소 토큰 분해 — [시도, 시군구..., 동, 번지]. 번지(숫자) 직전이 동.
    function jibunParts(o) {
      var jibun = (o.jibunAddress || '').trim();
      if (!jibun) return null;
      var t = jibun.split(/\s+/);
      var numIdx = -1;
      for (var i = 2; i < t.length; i++) { if (/\d/.test(t[i])) { numIdx = i; break; } }
      var dongIdx = numIdx > 1 ? numIdx - 1 : t.length - 1;
      return { tokens: t, dongIdx: dongIdx };
    }
    // 지번주소에서 동 추출. "서울특별시 강남구 역삼동 123-45" → "역삼동".
    function getDong(o) {
      var p = jibunParts(o);
      return p ? (p.tokens[p.dongIdx] || '') : '';
    }
    // 지번주소에서 시군구 추출(시도와 동 사이). "경기도 수원시 장안구 정자동" → "수원시 장안구".
    function getGu(o) {
      var p = jibunParts(o);
      if (!p || p.dongIdx < 2) return '';
      return p.tokens.slice(1, p.dongIdx).join(' ');
    }

    // ===== 아이디+비밀번호 로그인 게이트 =====
    // gateStep: 'idpw'(아이디+비번) | 'setup'(첫 로그인 — 이름+새 비번 설정)
    var gateStep = 'idpw';
    var gateLoginId = '';
    var gateBusy = false;
    var gateSetupMode = '';  // 'reset'(초기비번 0000) | 'register'(비번 미설정)
    var gateTempPw = '';     // reset 모드에서 입력한 초기 비번(현재 비번)

    function showGate(msg) { $('gate').style.display = 'flex'; gateToIdStep(); if (msg) $('gateErr').textContent = msg; }
    function hideGate() { $('gate').style.display = 'none'; }

    function gateToIdStep() {
      // 2026-06-05 [사용자 명시] 아이디+비밀번호 한 화면 두 칸 동시 입력.
      gateStep = 'idpw'; gateLoginId = '';
      $('gateSub').textContent = '아이디와 비밀번호를 입력해 주세요';
      $('gateId').style.display = ''; $('gateId').disabled = false;
      $('gateName').style.display = 'none'; $('gateName').value = '';
      $('gatePw').style.display = ''; $('gatePw').value = ''; $('gatePw').placeholder = '비밀번호';
      $('gateBtn').textContent = '로그인';
      $('gateBack').style.display = 'none';
      $('gateErr').textContent = '';
      setTimeout(function(){ $('gateId').focus(); }, 50);
    }

    function gateToSetupStep(mode) {
      // 첫 로그인 — 이름 + 새 비밀번호 설정. mode: 'reset'(초기비번 0000) / 'register'(비번 미설정)
      gateStep = 'setup'; gateSetupMode = mode;
      $('gateSub').innerHTML = '첫 로그인이에요. 이름과 새 비밀번호를 설정해 주세요<br><span style="font-size:12px;color:var(--sub)">재설정 후에는 새 비밀번호로 로그인하세요</span>';
      $('gateId').disabled = true;
      $('gateName').style.display = ''; $('gateName').value = '';
      $('gatePw').style.display = ''; $('gatePw').value = ''; $('gatePw').placeholder = '새 비밀번호';
      $('gateBtn').textContent = '설정하고 시작하기';
      $('gateBack').style.display = '';
      $('gateErr').textContent = '';
      setTimeout(function(){ $('gateName').focus(); }, 50);
    }

    function loginOk(j) {
      token = j.token;
      myName = j.name || '';
      sessionStorage.setItem('fieldmap_token', token);
      if (myName) { sessionStorage.setItem('fieldmap_name', myName); localStorage.setItem('fieldmap_manager', myName); }
      hideGate(); boot();
      // 로그인 직후 위치 권한 안내 (허용/차단)
      setTimeout(askGeo, 350);
    }

    function gateSubmit() {
      if (gateBusy) return;
      $('gateErr').textContent = '';
      if (gateStep === 'idpw') {
        var id = $('gateId').value.trim();
        var pw = $('gatePw').value.trim();
        if (!id) { $('gateId').focus(); return; }
        if (!pw) { $('gatePw').focus(); return; }
        gateBusy = true; $('gateBtn').disabled = true;
        fetch(API + '/fieldmap/auth/status', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ loginId: id }) })
          .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
          .then(function(res){
            if (!res.ok || !res.j.valid) { $('gateErr').textContent = '없는 아이디예요'; return; }
            gateLoginId = id;
            if (res.j.adminLocked) { $('gateErr').textContent = '관리자 비밀번호가 아직 설정되지 않았어요'; return; }
            if (res.j.registered) {
              // 입력한 비밀번호로 로그인 시도 — 초기비번(0000)이면 재설정 요구
              return fetch(API + '/fieldmap/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ loginId: id, password: pw }) })
                .then(function(r){ if (!r.ok) throw new Error('login'); return r.json(); })
                .then(function(j){
                  if (j.needsReset) { gateTempPw = pw; gateToSetupStep('reset'); return; }
                  loginOk(j);
                })
                .catch(function(){ $('gateErr').textContent = '비밀번호가 올바르지 않아요'; $('gatePw').value=''; $('gatePw').focus(); });
            }
            // 비번 미설정 계정 — 이름 + 새 비밀번호 설정 단계로
            gateToSetupStep('register');
          })
          .catch(function(){ $('gateErr').textContent = '잠시 후 다시 시도해 주세요'; })
          .then(function(){ gateBusy = false; $('gateBtn').disabled = false; });
      } else if (gateStep === 'setup') {
        var nm = $('gateName').value.trim();
        var npw = $('gatePw').value.trim();
        if (!nm) { $('gateErr').textContent = '이름을 입력해 주세요'; $('gateName').focus(); return; }
        if (npw.length < 4) { $('gateErr').textContent = '비밀번호는 4자 이상이에요'; $('gatePw').focus(); return; }
        if (npw === '0000') { $('gateErr').textContent = '초기 비밀번호(0000)는 사용할 수 없어요'; $('gatePw').focus(); return; }
        gateBusy = true; $('gateBtn').disabled = true;
        var setupUrl = gateSetupMode === 'reset' ? '/fieldmap/auth/reset-password' : '/fieldmap/auth/register';
        var setupBody = gateSetupMode === 'reset'
          ? { loginId: gateLoginId, currentPassword: gateTempPw, name: nm, newPassword: npw }
          : { loginId: gateLoginId, name: nm, password: npw };
        fetch(API + setupUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(setupBody) })
          .then(function(r){ if (!r.ok) throw new Error('setup'); return r.json(); })
          .then(function(j){ loginOk(j); })
          .catch(function(){ $('gateErr').textContent = '설정에 실패했어요. 다시 시도해 주세요'; })
          .then(function(){ gateBusy = false; $('gateBtn').disabled = false; });
      }
    }

    $('gateBtn').onclick = gateSubmit;
    $('gateBack').onclick = gateToIdStep;
    $('gateId').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('gatePw').focus(); });
    $('gateName').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('gatePw').focus(); });
    $('gatePw').addEventListener('keydown', function(e){ if (e.key === 'Enter') gateSubmit(); });

    // 로그아웃 — 세션 정리 후 게이트로 복귀
    $('logoutBtn').onclick = function() {
      if (!confirm('로그아웃 할까요?')) return;
      sessionStorage.removeItem('fieldmap_token');
      sessionStorage.removeItem('fieldmap_name');
      localStorage.removeItem('fieldmap_manager');
      location.reload();
    };

    // ===== Kakao SDK (clusterer 포함) =====
    function ensureKakaoReady() {
      if (sdkReadyPromise) return sdkReadyPromise;
      sdkReadyPromise = new Promise(function (resolve, reject) {
        if (typeof kakao !== 'undefined' && kakao.maps && kakao.maps.LatLng) { resolve(); return; }
        fetch(API + '/public/presale-inquiry/kakao-js-key')
          .then(function (r) { if (!r.ok) throw new Error('키 fetch 실패'); return r.json(); })
          .then(function (j) {
            var key = j && j.kakaoJsKey; if (!key) throw new Error('키 없음');
            var s = document.createElement('script');
            s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&libraries=services,clusterer&autoload=false';
            s.onload = function () { if (typeof kakao === 'undefined' || !kakao.maps) { reject(new Error('kakao.maps 없음')); return; } kakao.maps.load(function () { resolve(); }); };
            s.onerror = function () { reject(new Error('SDK 로드 실패')); };
            document.head.appendChild(s);
          })
          .catch(reject);
      });
      return sdkReadyPromise;
    }

    // ===== 부팅 =====
    function boot() {
      $('hint').textContent = '지도 불러오는 중…';
      ensureKakaoReady().then(initMap).catch(function(e){ $('hint').textContent = '지도 로드 실패'; console.error(e); });
      loadIncentive();
      setAccountInfo();
    }

    // 누적 인센티브 아래 — 로그인 계정 아이디 + 이름
    function setAccountInfo() {
      var uid = '';
      try { var p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); uid = (p && p.uid) || ''; } catch (e) {}
      var nm = myName || '';
      if (!uid && !nm) return;
      $('accountInfo').textContent = uid + (uid && nm ? ' · ' : '') + nm;
      $('accountInfo').classList.add('on');
    }

    // ===== 누적 인센티브 (가입완료 1건당 5,000원) =====
    function loadIncentive() {
      if (!token) return;
      fetch(API + '/fieldmap/me/incentive', { headers: authHeaders() })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if (!j) return;
          $('ibAmt').textContent = (Number(j.incentive) || 0).toLocaleString('ko-KR') + '원';
          $('incentiveBadge').classList.add('on');
        })
        .catch(function(){});
    }

    function initMap() {
      map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7 });
      // iOS 세이프에리어 적용 후 지도 캔버스 크기 재계산 (상단 미렌더 띠 방지)
      var fixLayout = function(){ if (map) map.relayout(); };
      setTimeout(fixLayout, 200); setTimeout(fixLayout, 700); setTimeout(fixLayout, 1600);
      window.addEventListener('orientationchange', function(){ setTimeout(fixLayout, 350); });
      window.addEventListener('pageshow', function(){ setTimeout(fixLayout, 120); });
      window.addEventListener('resize', fixLayout);
      clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: BOX_LEVEL + 1, gridSize: 80 });
      // 줌 변경 시 박스/클러스터 전환만 (재조회 X — 이미 로드된 지역 데이터로).
      kakao.maps.event.addListener(map, 'idle', scheduleRender);
      loadRegions();
    }

    function scheduleRender() { if (renderTimer) clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 120); }

    // ===== 내 위치 =====
    function requestLocation() {
      if (!navigator.geolocation) { toast('이 기기는 위치를 지원하지 않아요'); return; }
      $('locBtn').classList.add('loading');
      navigator.geolocation.getCurrentPosition(function(pos) {
        $('locBtn').classList.remove('loading');
        if (!map) return;
        var ll = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (!meOverlay) {
          var dot = document.createElement('div'); dot.className = 'me-dot';
          meOverlay = new kakao.maps.CustomOverlay({ position: ll, content: dot, zIndex: 9 });
        } else {
          meOverlay.setPosition(ll);
        }
        meOverlay.setMap(map);
        map.setLevel(3); map.panTo(ll);
      }, function(err) {
        $('locBtn').classList.remove('loading');
        // 2026-06-05 [사용자 명시] 위치 거부 원인별 안내 — 인앱 웹뷰(카톡 등)는 위치가 막혀 외부 브라우저로 유도.
        if (err && err.code === 1) {
          if (isInAppBrowser()) toast('카톡·문자 등 앱 안 브라우저는 위치가 막혀요. 우측 상단 메뉴로 사파리·크롬에서 열어 주세요', 5500);
          else if (isIOS()) toast('아이폰: 설정 > 개인정보 보호 및 보안 > 위치 서비스 > Safari 웹사이트 > "물어보기/허용" 으로 켠 뒤 다시 눌러 주세요', 6500);
          else toast('위치 권한이 꺼져 있어요. 폰·브라우저 설정에서 위치를 허용한 뒤 다시 눌러 주세요', 5000);
        } else {
          toast(err && err.code === 2 ? '위치 신호를 못 잡았어요. 잠시 후 다시 시도해 주세요' : '위치를 가져오지 못했어요');
        }
      }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 });
    }
    // 인앱 웹뷰(카톡/문자/SNS) 감지 — 위치 권한이 막히는 환경 안내용.
    function isInAppBrowser() {
      var ua = navigator.userAgent || '';
      return /KAKAOTALK|FBAN|FBAV|FB_IAB|Instagram|Line\/|NAVER\(inapp|DaumApps|BAND|everytime|; wv\)/i.test(ua);
    }
    function isIOS() { return /iPhone|iPad|iPod/i.test(navigator.userAgent || ''); }
    $('locBtn').onclick = requestLocation;

    // ===== 위치 권한 안내 (로그인 직후) =====
    function askGeo() { $('geoAsk').classList.add('on'); }
    $('geoAllow').onclick = function() { $('geoAsk').classList.remove('on'); requestLocation(); };
    $('geoDeny').onclick = function() { $('geoAsk').classList.remove('on'); };

    // 시/도·시군구 목록 받아 버튼 구성.
    function loadRegions() {
      $('hint').textContent = '지역 목록 불러오는 중…';
      fetch(API + '/fieldmap/regions', { headers: authHeaders() })
        .then(function(r){ if (r.status === 403) { showGate('다시 로그인해 주세요'); throw new Error('403'); } return r.json(); })
        .then(function(j){
          REGIONS = j.regions || [];
          var sidos = [];
          REGIONS.forEach(function(rg){ if (sidos.indexOf(rg.sido) < 0) sidos.push(rg.sido); });
          // 서울 → 경기 순서 고정 (가나다순 X).
          var SIDO_ORDER = ['서울특별시', '경기도', '인천광역시'];
          sidos.sort(function(a, b){
            var ia = SIDO_ORDER.indexOf(a); if (ia < 0) ia = 99;
            var ib = SIDO_ORDER.indexOf(b); if (ib < 0) ib = 99;
            return ia - ib || a.localeCompare(b, 'ko');
          });
          activeSido = sidos[0] || '';
          buildRegionUI(sidos);
          $('regionbar').style.display = 'block';
          $('hint').textContent = '지역 버튼을 눌러 표시하세요';
        })
        .catch(function(e){ if (String(e.message) !== '403') $('hint').textContent = '지역 목록 로드 실패'; });
    }

    function sidoShort(s) { return (s || '').replace('특별시', '').replace('광역시', '').replace('도', ''); }

    // 2026-06-06 [사용자 명시] 시도 토글(팝오버) 1줄 — [시도 ▾][구 선택 ▾][동 선택 ▾]. 3줄 → 1줄로 지도 공간 절약.
    //   시도 선택 시 그 시도의 구/군만 구 팝오버에 노출, 동은 선택한 구의 동만.
    function buildRegionUI(sidos) {
      REGION_SIDOS = sidos;
      if (!activeSido || sidos.indexOf(activeSido) < 0) activeSido = sidos[0] || '';
      $('regionRows').innerHTML =
        '<div class="rrow">' +
          '<button class="rr-pick rr-sido"></button>' +
          '<button class="rr-pick rr-gu">구 선택 ▾</button>' +
          '<button class="rr-pick rr-dong" disabled>동 선택 ▾</button>' +
        '</div>';
      var row = $('regionRows').querySelector('.rrow');
      row.querySelector('.rr-sido').onclick = function(e){ e.stopPropagation(); if (togglePop(this)) return; openSidoPop(this); };
      row.querySelector('.rr-gu').onclick = function(e){ e.stopPropagation(); if (togglePop(this)) return; openGuPop(this, activeSido); };
      row.querySelector('.rr-dong').onclick = function(e){ e.stopPropagation(); if (togglePop(this)) return; openDongPop(this); };
      refreshRegionLabels();
    }

    // 시도 팝오버 — 서울/경기/인천 중 선택.
    function openSidoPop(btn) {
      var items = REGION_SIDOS.map(function(s){ return { v: s, label: sidoShort(s) }; });
      openPop(btn, items, activeSido, function(s){ setActiveSido(s); });
    }
    function setActiveSido(s) {
      if (s === activeSido) { refreshRegionLabels(); return; }
      activeSido = s;
      loaded = {}; focusGu = ''; dongFilter = ''; loadingSet = {};
      renderAll(); refreshRegionLabels(); updateHint();
    }

    // 단일 행 라벨 갱신 — [시도][구][동].
    function refreshRegionLabels() {
      var row = $('regionRows').querySelector('.rrow'); if (!row) return;
      var sidoBtn = row.querySelector('.rr-sido'), guBtn = row.querySelector('.rr-gu'), dongBtn = row.querySelector('.rr-dong');
      sidoBtn.textContent = (sidoShort(activeSido) || '시도') + ' ▾';
      if (focusGu && loaded[focusGu]) {
        guBtn.textContent = focusGu + ' ▾'; guBtn.classList.add('on'); guBtn.classList.remove('ph');
        dongBtn.disabled = false;
        dongBtn.textContent = (dongFilter || '동 선택') + ' ▾';
        dongBtn.classList.toggle('on', !!dongFilter);
        dongBtn.classList.toggle('ph', !dongFilter);
      } else {
        guBtn.textContent = '구 선택 ▾'; guBtn.classList.remove('on'); guBtn.classList.add('ph');
        dongBtn.disabled = true; dongBtn.textContent = '동 선택 ▾'; dongBtn.classList.remove('on'); dongBtn.classList.remove('ph');
      }
    }

    // ===== 구/동 선택 팝오버 =====
    var popBtn = null;
    function closePop() { $('rPop').style.display = 'none'; popBtn = null; }
    // 같은 버튼 재클릭 시 닫기 — 열려있고 그 버튼이면 닫고 true 반환.
    function togglePop(btn) { if (popBtn === btn && $('rPop').style.display === 'block') { closePop(); return true; } return false; }
    function openPop(btn, items, curVal, onPick) {
      var pop = $('rPop');
      pop.innerHTML = items.map(function(it){
        return '<button data-v="' + esc(it.v) + '" class="' + (it.v === curVal ? 'on' : '') + '">' +
          esc(it.label) + (it.cnt != null ? '<span class="rp-cnt">' + it.cnt + '</span>' : '') + '</button>';
      }).join('');
      pop.style.display = 'block';
      popBtn = btn;
      var r = btn.getBoundingClientRect();
      pop.style.minWidth = Math.round(r.width) + 'px';
      pop.style.left = Math.round(r.left) + 'px';
      pop.style.top = Math.round(r.bottom + 5) + 'px';
      var pr = pop.getBoundingClientRect();
      if (pr.right > window.innerWidth - 8) pop.style.left = Math.round(Math.max(8, window.innerWidth - 8 - pr.width)) + 'px';
      Array.prototype.forEach.call(pop.querySelectorAll('[data-v]'), function(b){
        b.onclick = function(e){ e.stopPropagation(); closePop(); onPick(b.getAttribute('data-v')); };
      });
    }
    function openGuPop(btn, sido) {
      var items = REGIONS.filter(function(rg){ return rg.sido === sido; })
        .map(function(rg){ return { v: rg.sigungu, label: rg.sigungu, cnt: rg.count }; });
      openPop(btn, items, focusGu, function(sg){
        if (focusGu === sg) return; // 이미 표시 중 — 유지
        activeSido = sido; toggleRegion(sg);
      });
    }
    function openDongPop(btn) {
      if (!focusGu || !loaded[focusGu]) return;
      var dongs = [];
      loaded[focusGu].forEach(function(o){ var d = getDong(o); if (d && dongs.indexOf(d) < 0) dongs.push(d); });
      dongs.sort(function(a, b){ return a.localeCompare(b, 'ko'); });
      var items = [{ v: '', label: focusGu + ' 전체' }].concat(dongs.map(function(d){ return { v: d, label: d }; }));
      openPop(btn, items, dongFilter, function(d){ selectDong(d); });
    }
    // 팝오버 바깥 클릭/스크롤 시 닫기.
    document.addEventListener('click', function(e){
      if ($('rPop').style.display === 'block' && !$('rPop').contains(e.target) && !(e.target.closest && e.target.closest('.rr-pick'))) closePop();
    });

    function toggleRegion(sigungu) {
      if (loaded[sigungu]) {  // 같은 구 다시 → 해제(빈 지도)
        loaded = {}; focusGu = ''; dongFilter = '';
        renderAll(); refreshRegionLabels(); updateHint(); return;
      }
      if (loadingSet[sigungu]) return;
      // 단일 선택 — 다른 구 누르면 이전 구 전부 해제.
      loaded = {}; focusGu = ''; dongFilter = ''; loadingSet = {};
      loadingSet[sigungu] = true;
      renderAll(); refreshRegionLabels();
      fetch(API + '/fieldmap/offices?sigungu=' + encodeURIComponent(sigungu) + '&sido=' + encodeURIComponent(activeSido) + '&limit=60000', { headers: authHeaders() })
        .then(function(r){ if (r.status === 403) { showGate('다시 로그인해 주세요'); throw new Error('403'); } return r.json(); })
        .then(function(j){
          delete loadingSet[sigungu];
          loaded = {};
          loaded[sigungu] = (j.offices || []).filter(function(o){
            if (o.lat == null || o.lng == null) return false;
            // 2026-06-05 [사용자 명시] 지번주소 구 비교 — DB sigungu는 "고양시 덕양구"(공백), 지번주소는
            //   "고양시덕양구"(공백 없음) + 시도 접두 유무로 형식 제각각. 공백 제거 후 포함관계로 비교
            //   (경기 481→2 / 고양 2개 사고 fix). 명확히 다른 구만 제외.
            var g = getGu(o);
            if (!g) return true;
            var ng = g.replace(/\s/g, ''), ns = sigungu.replace(/\s/g, '');
            return ng === ns || ns.indexOf(ng) >= 0 || ng.indexOf(ns) >= 0;
          });
          focusGu = sigungu; dongFilter = '';
          renderAll(); refreshRegionLabels(); centerOn(loaded[sigungu], 7); updateHint();
        })
        .catch(function(e){ delete loadingSet[sigungu]; refreshRegionLabels(); if (String(e.message) !== '403') toast('지역 로드 실패'); });
    }

    function selectDong(dong) {
      dongFilter = dong;
      refreshRegionLabels(); renderAll();
      // 선택 동으로 줌
      var list = loaded[focusGu] ? loaded[focusGu].filter(function(o){ return !dong || getDong(o) === dong; }) : [];
      centerOn(list, dong ? 6 : 7); updateHint();  // 동=500m(6), 구 전체=1km(7)
    }

    function allLoadedOffices() {
      var arr = [];
      Object.keys(loaded).forEach(function(k){ arr = arr.concat(loaded[k]); });
      return arr;
    }
    // 표시 대상 — focus 구에 동 필터가 있으면 그 동만, 나머지 구는 전체.
    function visibleOffices() {
      var arr = [];
      Object.keys(loaded).forEach(function(k){
        if (k === focusGu && dongFilter) {
          loaded[k].forEach(function(o){ if (getDong(o) === dongFilter) arr.push(o); });
        } else {
          arr = arr.concat(loaded[k]);
        }
      });
      return arr;
    }

    function clearLayers() {
      if (typeof closeClusterPopover === 'function') closeClusterPopover();
      clusterer.clear(); markers = [];
      overlays.forEach(function(o){ o.setMap(null); }); overlays = [];
    }

    // 박스 상수 (픽셀)
    var BOX_W = 124, BOX_H = 48;
    var CLUSTER_MIN = 2;            // 같은 좌표 2곳 이상이면 블랙 숫자 배지(N) (탭 → 옆 팝오버)

    function renderAll() {
      if (!map) return;
      clearLayers();
      officeCache = {};
      var list = visibleOffices();
      list.forEach(function(o){ officeCache[o.id] = o; });
      if (map.getLevel() <= BOX_LEVEL) {
        renderBoxes(list);
      } else {
        list.forEach(function(o){
          var mk = new kakao.maps.Marker({ position: new kakao.maps.LatLng(o.lat, o.lng) });
          (function(id){ kakao.maps.event.addListener(mk, 'click', function(){ openSheet(id); }); })(o.id);
          markers.push(mk);
        });
        if (markers.length) clusterer.addMarkers(markers);
      }
    }

    function renderBoxes(list) {
      // 1) 뷰포트(+여유) 안 박스만 — 성능 + 화면 박스만 정렬
      var b = map.getBounds(), sw = b.getSouthWest(), ne = b.getNorthEast();
      var latPad = (ne.getLat() - sw.getLat()) * 0.3, lngPad = (ne.getLng() - sw.getLng()) * 0.3;
      var minLat = sw.getLat() - latPad, maxLat = ne.getLat() + latPad;
      var minLng = sw.getLng() - lngPad, maxLng = ne.getLng() + lngPad;
      // 2) 동일 좌표(같은 건물)로 묶기
      var groups = {};
      list.forEach(function(o){
        if (o.lat < minLat || o.lat > maxLat || o.lng < minLng || o.lng > maxLng) return;
        var k = o.lat.toFixed(5) + ',' + o.lng.toFixed(5);
        (groups[k] = groups[k] || []).push(o);
      });
      // 3) 그룹 → 1곳=단일 박스 / 2곳 이상=블랙 숫자 배지(N). 연결선·펼침·de-collision 없음.
      Object.keys(groups).forEach(function(k){
        var g = groups[k];
        var ll = new kakao.maps.LatLng(g[0].lat, g[0].lng);
        if (g.length >= CLUSTER_MIN) {
          createBoxOverlay({ cluster: true, offices: g, ll: ll });
        } else {
          createBoxOverlay({ o: g[0], ll: ll });
        }
      });
    }

    // 박스를 점(실제 위치) 바로 위, 가로 중앙에 배치 (연결선 없음).
    function positionBox(box) {
      box.style.left = (-BOX_W / 2).toFixed(1) + 'px';
      box.style.top = (-(BOX_H + 20)).toFixed(1) + 'px';
    }

    function createBoxOverlay(it) {
      var wrap = document.createElement('div');
      wrap.className = 'pin-wrap';
      if (it.cluster) {
        // 동일 좌표 N곳 → 원형 숫자 배지 + "N개의 추천 부동산" 캡션(이미지2). 탭하면 옆에 팝오버 목록.
        var badge = document.createElement('div'); badge.className = 'cluster-badge';
        badge.innerHTML = '<div class="cb-circle">' + it.offices.length + '</div><div class="cb-cap">' + it.offices.length + '개의 추천 부동산</div>';
        (function(offs){ badge.onclick = function(e){ e.stopPropagation(); openClusterPopover(offs, badge); }; })(it.offices);
        wrap.appendChild(badge);
      } else {
        var o = it.o;
        wrap.className = 'pin-wrap' + (o.status ? ' s-' + o.status : '');
        var icon = document.createElement('div'); icon.className = 'pin-icon';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>';
        var box = document.createElement('div'); box.className = 'office-box'; box.style.width = BOX_W + 'px';
        box.innerHTML = '<b>' + esc(o.name) + '</b>' + (o.ownerName ? '<span class="ob-sub">' + esc(o.ownerName) + '</span>' : '');
        (function(id){ box.onclick = function(e){ e.stopPropagation(); openSheet(id); }; })(o.id);
        wrap.appendChild(icon); wrap.appendChild(box);
        positionBox(box);
      }
      var ov = new kakao.maps.CustomOverlay({ position: it.ll, content: wrap, xAnchor: 0, yAnchor: 0, clickable: true, zIndex: it.cluster ? 4 : 3 });
      ov.setMap(map); overlays.push(ov);
    }

    // 묶음 박스 탭 → 바로 옆 팝오버에 N곳 목록. 항목 선택 시 상세 시트.
    function openClusterPopover(offices, anchorEl) {
      closeClusterPopover();
      var arr = offices.slice().sort(function(a, c){ return (a.name || '').localeCompare(c.name || '', 'ko'); });
      var back = document.createElement('div'); back.id = 'clusterPopBack';
      back.style.cssText = 'position:fixed;inset:0;z-index:1099;';
      back.onclick = function(){ closeClusterPopover(); };
      document.body.appendChild(back);
      var pop = document.createElement('div'); pop.className = 'cluster-pop'; pop.id = 'clusterPop';
      var html = '<div class="cp-head">이 위치 ' + arr.length + '곳</div><div class="cp-list">';
      arr.forEach(function(o){
        var dark = (o.status === 'REVISIT');
        var rowCls = 'cp-row' + (o.status ? ' done' + (dark ? ' dark' : '') : '');
        var rowBg = o.status ? ' style="background:' + STATUS_COLOR[o.status] + '"' : '';
        var st = o.status ? '<span class="cp-stat">' + STATUS_LABEL[o.status] + '</span>' : '';
        html += '<button class="' + rowCls + '"' + rowBg + ' data-id="' + o.id + '"><span class="cp-name">' + esc(o.name) + '</span>' + (o.ownerName ? '<span class="cp-owner">' + esc(o.ownerName) + '</span>' : '') + st + '</button>';
      });
      html += '</div>';
      pop.innerHTML = html;
      document.body.appendChild(pop);
      // 박스 오른쪽에 배치, 공간 없으면 왼쪽/화면 안으로 보정.
      var r = anchorEl.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight, M = 8;
      var left = r.right + M; if (left + pw > window.innerWidth - M) left = r.left - pw - M;
      if (left < M) left = M;
      var top = r.top; if (top + ph > window.innerHeight - M) top = window.innerHeight - ph - M;
      if (top < M) top = M;
      pop.style.left = left.toFixed(0) + 'px'; pop.style.top = top.toFixed(0) + 'px';
      Array.prototype.forEach.call(pop.querySelectorAll('.cp-row'), function(btn){
        btn.onclick = function(e){ e.stopPropagation(); closeClusterPopover(); openSheet(btn.getAttribute('data-id')); };
      });
    }
    function closeClusterPopover() {
      ['clusterPop', 'clusterPopBack'].forEach(function(id){ var e = document.getElementById(id); if (e && e.parentNode) e.parentNode.removeChild(e); });
    }

    // 평균 좌표를 화면 중앙으로 + 지정 레벨 (구=7≈1km, 동=6≈500m).
    function centerOn(list, level) {
      if (!list || !list.length) return;
      var sLat = 0, sLng = 0;
      list.forEach(function(o){ sLat += o.lat; sLng += o.lng; });
      map.setLevel(level);
      map.setCenter(new kakao.maps.LatLng(sLat / list.length, sLng / list.length));
    }

    function updateHint() {
      var n = allLoadedOffices().length;
      var regs = Object.keys(loaded).length;
      $('hint').textContent = regs ? (regs + '개 지역 · ' + n + '곳 (확대하면 박스)') : '지역 버튼을 눌러 표시하세요';
    }

    // ===== 바텀시트 =====
    var sheetOfficeId = null;
    function openSheet(id) {
      sheetOfficeId = id;
      var o = officeCache[id];
      $('sheetBody').innerHTML = '<div class="sheet-name">불러오는 중…</div>';
      $('scrim').classList.add('on'); $('sheet').classList.add('on');
      fetch(API + '/fieldmap/offices/' + id, { headers: authHeaders() })
        .then(function(r){ return r.json(); })
        .then(function(full){ officeCache[id] = Object.assign(o || {}, full); renderSheet(full); })
        .catch(function(){ if (o) renderSheet(o); });
    }
    function closeSheet() { $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); sheetOfficeId = null; }
    $('scrim').onclick = closeSheet;
    $('sheetClose').onclick = closeSheet;

    function renderSheet(o) {
      var addr = o.roadAddress || o.jibunAddress || '';
      var routeUrl = 'https://map.kakao.com/link/to/' + encodeURIComponent(o.name || '부동산') + ',' + o.lat + ',' + o.lng;
      var html = '';
      html += '<div class="sheet-head"><div class="sheet-name">' + esc(o.name) + '</div>' +
        '<div class="sheet-actions">' +
        (o.status ? '<button class="btn-reset" id="resetBtn">↺ 초기화</button>' : '') +
        '<button class="btn-memo" id="memoBtn">📝 메모</button>' +
        '</div></div>';
      html += '<div class="sheet-meta">';
      if (o.ownerName) html += '대표 ' + esc(o.ownerName) + '<br>';
      if (o.regNo) html += '등록번호 ' + esc(o.regNo) + '<br>';
      if (addr) html += esc(addr);
      html += '</div>';
      html += '<div id="memoArea">' + (o.note ? '<div class="memo-box">' + esc(o.note) + '</div>' : '') + '</div>';
      if (o.status) {
        var darkText = (o.status === 'REVISIT'); // 노랑(재방문)만 어두운 글자
        html += '<span class="badge" style="background:' + STATUS_COLOR[o.status] + (darkText ? ';color:#4A3A00' : '') + '">' + STATUS_LABEL[o.status] + (o.managerName ? ' · ' + esc(o.managerName) : '') + (o.statusAt ? ' · ' + fmtTime(o.statusAt) : '') + '</span>';
      }
      // 1행: 가입완료 · 전달완료
      html += '<div class="status-grid">';
      ['SIGNUP','DELIVERED'].forEach(function(s){
        html += '<button class="sg-' + s + '" data-status="' + s + '">' + STATUS_LABEL[s] + '</button>';
      });
      html += '</div>';
      // 2행: 길찾기(좌) | 재방문·실패(우 한 칸에 2개)
      html += '<div class="act-row2">';
      html += '<a class="btn-route" href="' + routeUrl + '" target="_blank" rel="noopener">🧭 길찾기</a>';
      html += '<div class="sub2">';
      ['REVISIT','FAIL'].forEach(function(s){
        html += '<button class="sg-' + s + '" data-status="' + s + '">' + STATUS_LABEL[s] + '</button>';
      });
      html += '</div></div>';
      html += '<div class="hist-title">방문 이력 (' + ((o.visits && o.visits.length) || 0) + ')</div>';
      if (o.visits && o.visits.length) {
        o.visits.forEach(function(v){
          html += '<div class="hist-item"><div class="hi-top"><span class="hi-st" style="color:' + STATUS_COLOR[v.status] + '">' + STATUS_LABEL[v.status] + ' · ' + esc(v.managerName) + '</span><span class="hi-time">' + fmtTime(v.createdAt) + '</span></div>';
          html += '<div class="hi-photos">' + (v.photo1Url ? '<img src="' + esc(v.photo1Url) + '">' : '') + (v.photo2Url ? '<img src="' + esc(v.photo2Url) + '">' : '') + '</div></div>';
        });
      } else {
        html += '<div class="empty-hist">아직 방문 이력이 없어요.</div>';
      }
      $('sheetBody').innerHTML = html;
      Array.prototype.forEach.call($('sheetBody').querySelectorAll('[data-status]'), function(btn){
        btn.onclick = function(){ startAction(btn.getAttribute('data-status')); };
      });
      var mb = document.getElementById('memoBtn');
      if (mb) mb.onclick = function(){ editMemo(o); };
      var rb = document.getElementById('resetBtn');
      if (rb) rb.onclick = function(){ resetOffice(o); };
    }

    // ===== 상태 초기화 (실수 정정) =====
    function resetOffice(o) {
      if (!confirm('이 부동산의 사진·명함·상태가 모두 초기화됩니다.\n진행할까요?')) return;
      fetch(API + '/fieldmap/offices/' + o.id + '/reset', { method: 'POST', headers: authHeaders() })
        .then(function(r){ if (!r.ok) throw new Error('실패'); return r.json(); })
        .then(function(updated){
          officeCache[o.id] = updated;
          renderSheet(updated);
          toast('초기화됐어요');
          Object.keys(loaded).forEach(function(k){
            loaded[k].forEach(function(of){ if (of.id === o.id) { of.status = null; of.managerName = null; of.statusAt = null; } });
          });
          renderAll();
          loadIncentive();
        })
        .catch(function(){ toast('초기화 실패'); });
    }

    // ===== 메모 (바텀시트 우측상단 버튼) =====
    function editMemo(o) {
      var area = document.getElementById('memoArea');
      if (!area) return;
      area.innerHTML = '<textarea class="memo-edit" id="memoInput" placeholder="이 부동산 메모를 적어두세요">' + esc(o.note || '') + '</textarea>' +
        '<div class="memo-actions"><button class="memo-cancel" id="memoCancel">취소</button><button class="memo-save" id="memoSave">메모 저장</button></div>';
      var ta = document.getElementById('memoInput'); ta.focus();
      document.getElementById('memoCancel').onclick = function(){ renderSheet(officeCache[o.id] || o); };
      document.getElementById('memoSave').onclick = function(){ saveMemo(o, ta.value); };
    }
    function saveMemo(o, note) {
      fetch(API + '/fieldmap/offices/' + o.id, { method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ note: note }) })
        .then(function(r){ if (!r.ok) throw new Error('실패'); return r.json(); })
        .then(function(updated){ officeCache[o.id] = Object.assign(officeCache[o.id] || {}, updated); renderSheet(officeCache[o.id]); toast('메모 저장됨'); })
        .catch(function(){ toast('메모 저장 실패'); });
    }

    // ===== 액션 모달 (담당자 → 사진 → 저장) =====
    // 가입완료·전달완료: 매장+명함 2장 / 재방문·실패: 둘 중 1장.
    var pendingStatus = null, photo1Url = null, photo2Url = null;
    function photosNeedBoth() { return pendingStatus === 'SIGNUP' || pendingStatus === 'DELIVERED'; }
    function photosOk() { return photosNeedBoth() ? !!(photo1Url && photo2Url) : !!(photo1Url || photo2Url); }
    function startAction(status) {
      pendingStatus = status; photo1Url = null; photo2Url = null;
      $('mStep1').style.display = ''; $('mStep2').style.display = 'none';
      $('mName').value = myName || localStorage.getItem('fieldmap_manager') || '';
      resetSlot(1); resetSlot(2); $('mSubmit').disabled = true;
      $('modal').classList.add('on'); setTimeout(function(){ $('mName').focus(); }, 50);
    }
    function closeModal() { $('modal').classList.remove('on'); }
    Array.prototype.forEach.call(document.querySelectorAll('[data-mcancel]'), function(b){ b.onclick = closeModal; });

    $('mNameNext').onclick = function() {
      var n = $('mName').value.trim();
      if (!n) { $('mName').focus(); return; }
      localStorage.setItem('fieldmap_manager', n);
      $('photoSub').textContent = photosNeedBoth()
        ? '매장사진과 명함사진 2장을 등록해 주세요.'
        : '매장사진 또는 명함사진 중 1장만 등록해도 돼요.';
      $('mStep1').style.display = 'none'; $('mStep2').style.display = '';
    };

    function resetSlot(n) {
      var slot = $('slot' + n);
      slot.classList.remove('filled');
      slot.querySelector('img') && slot.querySelector('img').remove();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.photo-slot input'), function(inp){
      inp.onchange = function() {
        var file = inp.files && inp.files[0]; if (!file) return;
        var n = inp.getAttribute('data-slot');
        var slot = $('slot' + n);
        var prev = URL.createObjectURL(file);
        var img = slot.querySelector('img') || document.createElement('img');
        img.src = prev; if (!img.parentNode) slot.appendChild(img);
        slot.classList.add('filled');
        // 업로드
        uploadPhoto(file).then(function(url){
          if (n === '1') photo1Url = url; else photo2Url = url;
          $('mSubmit').disabled = !photosOk();
        }).catch(function(){ toast('사진 업로드 실패'); slot.classList.remove('filled'); });
      };
    });

    $('mSubmit').onclick = function() {
      if (!photosOk() || !pendingStatus || !sheetOfficeId) return;
      var manager = ($('mName').value || localStorage.getItem('fieldmap_manager') || '').trim();
      $('mSubmit').disabled = true;
      fetch(API + '/fieldmap/offices/' + sheetOfficeId + '/visit', {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ status: pendingStatus, managerName: manager, photo1Url: photo1Url, photo2Url: photo2Url })
      })
        .then(function(r){ if (!r.ok) throw new Error('저장 실패'); return r.json(); })
        .then(function(updated){
          officeCache[sheetOfficeId] = updated;
          closeModal(); renderSheet(updated);
          toast(STATUS_LABEL[pendingStatus] + ' 저장됨');
          // 로드된 지역 데이터의 해당 부동산 상태 갱신 → 박스 색 즉시 반영.
          Object.keys(loaded).forEach(function(k){
            loaded[k].forEach(function(o){
              if (o.id === sheetOfficeId) { o.status = updated.status; o.managerName = updated.managerName; o.statusAt = updated.statusAt; }
            });
          });
          renderAll();
          if (pendingStatus === 'SIGNUP') loadIncentive();
        })
        .catch(function(){ toast('저장 실패'); $('mSubmit').disabled = false; });
    };

    // 클라 측 압축 후 업로드
    function uploadPhoto(file) {
      return compressImage(file, 1280, 0.7).then(function(blob){
        var fd = new FormData(); fd.append('photo', blob, 'photo.jpg');
        return fetch(API + '/fieldmap/upload', { method: 'POST', headers: authHeaders(), body: fd })
          .then(function(r){ if (!r.ok) throw new Error('upload'); return r.json(); })
          .then(function(j){ return j.url; });
      });
    }
    function compressImage(file, maxDim, quality) {
      return new Promise(function(resolve, reject){
        var img = new Image(); var url = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(url);
          var w = img.width, h = img.height;
          if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
          else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
          var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          cv.toBlob(function(b){ b ? resolve(b) : reject(new Error('blob')); }, 'image/jpeg', quality);
        };
        img.onerror = function(){ reject(new Error('img')); };
        img.src = url;
      });
    }

    // ===== 검색 (등록번호/대표자/상호명/주소 → 지도 20m 이동) =====
    var searchTimer = null, searchPin = null;

    $('searchFab').onclick = function(){
      var p = $('searchPanel'); p.classList.toggle('on');
      if (p.classList.contains('on')) setTimeout(function(){ $('searchInput').focus(); }, 50);
    };
    $('searchClose').onclick = function(){ $('searchPanel').classList.remove('on'); };
    $('searchInput').addEventListener('input', function(){
      if (searchTimer) clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 280);
    });
    $('searchInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') { if (searchTimer) clearTimeout(searchTimer); doSearch(); }
    });

    function doSearch(){
      var q = $('searchInput').value.trim();
      if (!q) { $('searchResults').innerHTML = ''; return; }
      $('searchResults').innerHTML = '<div class="sr-empty">검색 중…</div>';
      fetch(API + '/fieldmap/search?q=' + encodeURIComponent(q), { headers: authHeaders() })
        .then(function(r){ return r.ok ? r.json() : { results: [] }; })
        .then(function(j){ renderSearchResults(j.results || []); })
        .catch(function(){ $('searchResults').innerHTML = '<div class="sr-empty">검색 실패</div>'; });
    }

    function renderSearchResults(rows){
      if (!rows.length) { $('searchResults').innerHTML = '<div class="sr-empty">검색 결과가 없어요</div>'; return; }
      var html = '';
      rows.forEach(function(o, i){
        var addr = o.roadAddress || o.jibunAddress || '';
        var noGeo = (o.lat == null || o.lng == null);
        var badge = o.status ? '<span class="sr-badge" style="background:' + STATUS_COLOR[o.status] + (o.status === 'DELIVERED' ? ';color:#4A3A00' : '') + '">' + STATUS_LABEL[o.status] + '</span>' : '';
        html += '<div class="sr-item" data-i="' + i + '">'
          + '<div class="sr-name">' + esc(o.name) + badge + '</div>'
          + '<div class="sr-sub">' + (o.ownerName ? esc(o.ownerName) + ' · ' : '') + (o.regNo ? esc(o.regNo) : '') + (addr ? '<br>' + esc(addr) : '') + (noGeo ? '<br><span class="sr-nogeo">좌표 없음 — 지도 이동 불가</span>' : '') + '</div>'
          + '</div>';
      });
      $('searchResults').innerHTML = html;
      Array.prototype.forEach.call($('searchResults').querySelectorAll('.sr-item'), function(el){
        el.onclick = function(){ gotoOffice(rows[Number(el.getAttribute('data-i'))]); };
      });
    }

    function setSearchPin(o, ll){
      if (searchPin) searchPin.setMap(null);
      var el = document.createElement('div');
      el.className = 'search-pin';
      el.innerHTML = '<div class="sp-label">' + esc(o.name) + '</div><div class="sp-dot"></div>';
      searchPin = new kakao.maps.CustomOverlay({ position: ll, content: el, xAnchor: 0.5, yAnchor: 1, zIndex: 99 });
      searchPin.setMap(map);
    }

    function gotoOffice(o){
      if (o.lat == null || o.lng == null) { toast('이 부동산은 좌표가 없어 이동할 수 없어요'); return; }
      if (!map) { toast('지도를 불러오는 중이에요'); return; }
      $('searchPanel').classList.remove('on');
      var ll = new kakao.maps.LatLng(o.lat, o.lng);
      map.setLevel(1);            // 약 20m 뷰 (가장 가까이)
      map.setCenter(ll);
      setSearchPin(o, ll);
    }

    // ===== 시작 =====
    if (token) { hideGate(); boot(); } else { showGate(); }
  </script>
</body>
</html>
